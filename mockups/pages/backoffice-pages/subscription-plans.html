<style>
.plan-page .form-panel,
.plan-page .form-panel > .col {
    width: 100%;
}

.plan-order-cell {
    display: flex;
    align-items: center;
    gap: 8px;
}

.plan-order-input {
    width: 64px;
    min-width: 64px;
}

.plan-page {
    width: calc(100% - 35px);
    margin: var(--space-3);
}

    .plan-page .form-line {
        display: grid !important;
        grid-template-columns: repeat(12, minmax(0, 1fr)) !important;
        align-items: end !important;
        gap: 20px 24px !important;
        width: 100% !important;
        max-width: none !important;
        margin-top: 20px !important;
    }

    .plan-page .form-line > .form-field {
        width: 100% !important;
        min-width: 0 !important;
    }

    .plan-page .form-line > .w-1 {
        grid-column: span 1 !important;
    }

    .plan-page .form-line > .w-2 {
        grid-column: span 2 !important;
    }

    .plan-page .form-line > .w-3 {
        grid-column: span 3 !important;
    }

    .plan-page .form-line > .w-4 {
        grid-column: span 4 !important;
    }

    .plan-page .form-line > .w-5 {
        grid-column: span 5 !important;
    }

    .plan-page .form-line > .w-6 {
        grid-column: span 6 !important;
    }

    .plan-page .form-line > .w-7 {
        grid-column: span 7 !important;
    }

    .plan-page .form-line > .w-8 {
        grid-column: span 8 !important;
    }

    .plan-page .form-line > .w-9 {
        grid-column: span 9 !important;
    }

    @media (max-width: 980px) {
        .plan-page .form-line {
            grid-template-columns: repeat(6, minmax(0, 1fr)) !important;
        }

        .plan-page .form-line > .w-1,
        .plan-page .form-line > .w-2 {
            grid-column: span 1 !important;
        }

        .plan-page .form-line > .w-3,
        .plan-page .form-line > .w-4,
        .plan-page .form-line > .w-5,
        .plan-page .form-line > .w-6,
        .plan-page .form-line > .w-7,
        .plan-page .form-line > .w-8,
        .plan-page .form-line > .w-9 {
            grid-column: span 3 !important;
        }
    }

    @media (max-width: 640px) {
        .plan-page .form-line {
            grid-template-columns: 1fr !important;
        }

        .plan-page .form-line > .w-1,
        .plan-page .form-line > .w-2,
        .plan-page .form-line > .w-3,
        .plan-page .form-line > .w-4,
        .plan-page .form-line > .w-5,
        .plan-page .form-line > .w-6,
        .plan-page .form-line > .w-7,
        .plan-page .form-line > .w-8,
        .plan-page .form-line > .w-9 {
            grid-column: 1 / -1 !important;
        }
    }
</style>

<div class="plan-page d-flex col">

    <div class="col gap-3 mb-3">
        <h1 class="text-display-4">Planos</h1>
        <p class="text-heading-5 text-muted">Cadastre e organize os planos comerciais do catálogo. Todo plano começa em rascunho de publicação.</p>
    </div>

    <hr style="width: 100%;">

    <form class="form-panel" id="plan-form">
        <div class="col">
            <div class="form-line">
                <div class="form-field w-6" style="width: 100%; min-width: 0; grid-column: span 6;">
                    <label for="plan-name">Nome-base do plano</label>
                    <input id="plan-name" name="base_name" type="text" autocomplete="off" placeholder="Advocacia, Essencial, Premium" required>
                </div>

                <div class="form-field w-3" style="width: 100%; min-width: 0; grid-column: span 3;">
                    <label for="plan-code">Código</label>
                    <input id="plan-code" name="code" type="text" placeholder="law-essencial" autocomplete="off" readonly required>
                </div>

                <div class="form-field w-3" style="width: 100%; min-width: 0; grid-column: span 3;">
                    <label for="plan-system">Sistema principal</label>
                    <select id="plan-system" name="system" required>
                        <option value="" selected disabled>Selecione aqui</option>
                        <option value="Fokus Cloud Law">Fokus Cloud Law</option>
                        <option value="Fokus Cloud Lead One">Fokus Cloud Lead One</option>
                        <option value="Fokus Cloud Lead Team">Fokus Cloud Lead Team</option>
                    </select>
                </div>
            </div>

            <div class="form-line">
                <div class="form-field w-4" style="width: 100%; min-width: 0; grid-column: span 4;">
                    <label for="plan-monthly">Valor mensal</label>
                    <input id="plan-monthly" name="monthly_amount" type="text" inputmode="decimal" class="money-input" placeholder="R$ 0,00" required>
                </div>

                <div class="form-field w-4" style="width: 100%; min-width: 0; grid-column: span 4;">
                    <label for="plan-annual">Valor anual</label>
                    <input id="plan-annual" name="annual_amount" type="text" inputmode="decimal" class="money-input" placeholder="R$ 0,00" readonly required>
                </div>

                <div class="form-field w-4" style="width: 100%; min-width: 0; grid-column: span 4;">
                    <label for="plan-order">Ordem inicial</label>
                    <input id="plan-order" name="display_order" type="number" min="1" step="1" value="1" readonly>
                </div>
            </div>

            <div class="form-line">
                <div class="form-field w-6" style="width: 100%; min-width: 0; grid-column: span 6;">
                    <label for="plan-technical-description">Descrição técnica</label>
                    <textarea id="plan-technical-description" name="technical_description" placeholder="Regras do plano, limites, dependências e composição técnica"></textarea>
                </div>

                <div class="form-field w-6" style="width: 100%; min-width: 0; grid-column: span 6;">
                    <label for="plan-commercial-content">Conteúdo comercial</label>
                    <textarea id="plan-commercial-content" name="commercial_content" placeholder="Texto de oferta, benefícios e mensagem exibida ao cliente"></textarea>
                </div>
            </div>
        </div>

        <div class="form-actions">
            <button class="submit" type="submit">Cadastrar plano</button>
            <button class="button button-secondary" type="reset">Limpar</button>
        </div>

        <div class="system-notice" id="plan-message" role="status" aria-live="polite" aria-atomic="true" hidden></div>
    </form>

    <div class="table-panel">
        <table class="data-table" aria-label="Planos cadastrados">
            <thead>
                <tr>
                    <th>Código</th>
                    <th>Plano</th>
                    <th>Sistema</th>
                    <th>Mensal</th>
                    <th>Anual</th>
                    <th>Publicação</th>
                    <th>Status</th>
                    <th>Ordem</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="plan-list">
                <tr>
                    <td colspan="10">Carregando planos...</td>
                </tr>
            </tbody>
        </table>
    </div>

</div>

<script>
    (() => {
        const standalone = !document.querySelector(".container-page");
        const iconBasePath = standalone ? "./../../assets/icons/" : "./../assets/icons/";

        if (standalone) {
            document.documentElement.dataset.theme ||= "light";
            document.documentElement.dataset.role ||= "admin";
            document.body.classList.add("container-content");

            if (!document.querySelector('link[data-plans-standalone-css]')) {
                const css = document.createElement("link");
                css.rel = "stylesheet";
                css.href = "./../../assets/css/main.css?v=20260828-12";
                css.dataset.plansStandaloneCss = "true";
                document.head.appendChild(css);
            }
        }

        const form = document.querySelector("#plan-form");
        const name = document.querySelector("#plan-name");
        const code = document.querySelector("#plan-code");
        const system = document.querySelector("#plan-system");
        const monthly = document.querySelector("#plan-monthly");
        const annual = document.querySelector("#plan-annual");
        const technicalDescription = document.querySelector("#plan-technical-description");
        const commercialContent = document.querySelector("#plan-commercial-content");
        const planList = document.querySelector("#plan-list");
        const message = document.querySelector("#plan-message");
        let messageTimer = null;
        let mockPlans = [
            {
                id: "pln_law_ess",
                code: "law-advocacia",
                base_name: "Advocacia",
                system: "Fokus Cloud Law",
                publication_state: "publicado",
                technical_description: "Plano base para advocacia com composição técnica enxuta e foco em acompanhamento processual.",
                commercial_content: "Oferta de entrada para escritórios que precisam centralizar processos, partes e agenda.",
                monthly_amount: 94.9,
                annual_amount: 849.9,
                display_order: 1,
                status: "ativo",
            },
            {
                id: "pln_lead_pro",
                code: "lead-one-profissional",
                base_name: "Profissional",
                system: "Fokus Cloud Lead One",
                publication_state: "rascunho",
                technical_description: "Plano com maior amplitude comercial para captura, funil e acompanhamento de leads.",
                commercial_content: "Oferta pensada para corretores que precisam de operação comercial mais madura.",
                monthly_amount: 34.9,
                annual_amount: 309.9,
                display_order: 2,
                status: "ativo",
            },
            {
                id: "pln_team_prem",
                code: "lead-team-premium",
                base_name: "Premium",
                system: "Fokus Cloud Lead Team",
                publication_state: "pausado",
                technical_description: "Plano com governança, colaboração e recursos de gestão de equipe.",
                commercial_content: "Pacote comercial para imobiliárias e grupos de corretores com operação colaborativa.",
                monthly_amount: 144.9,
                annual_amount: 1299.9,
                display_order: 3,
                status: "inativo",
            },
            {
                id: "pln_lead_arch",
                code: "lead-team-exclusivo",
                base_name: "Exclusivo",
                system: "Fokus Cloud Lead Team",
                publication_state: "arquivado",
                technical_description: "Plano arquivado e sem uso comercial ativo.",
                commercial_content: "Versão anterior do catálogo, preservada para histórico.",
                monthly_amount: 199.9,
                annual_amount: 1799.9,
                display_order: 4,
                status: "inativo",
            },
        ];

        const api = window.FokusApi || {
            async request(path, options = {}) {
                if (path === "/backoffice/plans" && !options.method) return mockPlans;
                if (path === "/backoffice/plans" && options.method === "POST") {
                    mockPlans = [{
                        ...options.body,
                        id: `pln_${Date.now()}`,
                        code: options.body.code || normalizeCode(options.body.name),
                    }, ...mockPlans];
                    return { message: "Plano cadastrado." };
                }
                if (path.startsWith("/backoffice/plans/") && options.method === "PATCH") {
                    const id = path.split("/").pop();
                    mockPlans = mockPlans.map((plan) => plan.id === id
                        ? {
                            ...plan,
                            ...(options.body.status !== undefined ? { status: options.body.status } : {}),
                            ...(options.body.display_order !== undefined ? { display_order: Number(options.body.display_order) } : {}),
                        }
                        : plan);
                    return { message: "Status do plano atualizado." };
                }
                if (path.startsWith("/backoffice/plans/") && options.method === "DELETE") {
                    const id = path.split("/").pop();
                    mockPlans = mockPlans.filter((plan) => plan.id !== id);
                    return { message: "Plano excluído." };
                }
                return null;
            },
        };

        const formatInputMoney = (value) => {
            const digits = String(value ?? "").replace(/\D/g, "");
            if (!digits) return "";
            return (Number(digits) / 100).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
        };
        const formatMoneyValue = (value) => Number(value || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
        const parseInputMoney = (value) => Number(String(value || "").replace(/[^0-9]/g, "")) / 100 || 0;
        const toCents = (value) => Math.round(parseInputMoney(value) * 100);
        const calculateAnnualCents = (monthlyCents) => {
            const grossCents = monthlyCents * 9;
            const roundedDownCents = Math.floor(grossCents / 500) * 500;
            return Math.max(0, roundedDownCents - 10);
        };
        const syncAnnual = () => {
            const monthlyCents = toCents(monthly.value);
            annual.value = monthlyCents ? formatMoneyValue(calculateAnnualCents(monthlyCents) / 100) : "";
        };
        const slugify = (value) => String(value || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
        const normalizeCode = () => {
            const systemPart = slugify(system.value).split("-").filter(Boolean).pop() || "";
            const planPart = slugify(name.value).split("-").filter(Boolean)[0] || "";
            return [systemPart, planPart].filter(Boolean).join("-");
        };
        const getSystemLabel = (value) => ({
            "Fokus Cloud Law": "Fokus Cloud Law",
            "Fokus Cloud Lead One": "Fokus Cloud Lead One",
            "Fokus Cloud Lead Team": "Fokus Cloud Lead Team",
        }[value] || value || "-");
        const getPublicationMeta = (value) => ({
            rascunho: ["Rascunho", "status-draft"],
            publicado: ["Publicado", "status-published"],
            pausado: ["Pausado", "status-paused"],
            arquivado: ["Arquivado", "status-archived"],
        }[value] || ["-", "status-draft"]);
        const escapeHtml = (value) => String(value ?? "").replace(/[&<>"']/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" }[char]));

        function setMessage(text, type = "info") {
            clearTimeout(messageTimer);
            message.textContent = text || "";
            message.hidden = !text;
            if (!text) {
                message.removeAttribute("data-tone");
                return;
            }
            message.dataset.tone = type || "info";
            messageTimer = window.setTimeout(() => {
                message.textContent = "";
                message.hidden = true;
                message.removeAttribute("data-tone");
            }, 5000);
        }

        function getStatusLabel(value) {
            return ({
                ativo: "Ativo",
                inativo: "Inativo",
            }[value] || value || "-");
        }

        function getStatusTone(value) {
            return ({
                ativo: "status-active",
                inativo: "status-inactive",
            }[value] || "info");
        }

        function renderPlans() {
            if (!mockPlans.length) {
                planList.innerHTML = '<tr><td colspan="9">Nenhum plano cadastrado.</td></tr>';
                return;
            }

            planList.innerHTML = mockPlans.map((plan) => {
                const [publicationLabel, publicationClass] = getPublicationMeta(plan.publication_state);
                const isActive = plan.status === "ativo";
                const toggleIcon = isActive ? "Subtract-Square--Streamline-Ultimate.png" : "Add-Square--Streamline-Ultimate.png";
                const toggleTitle = isActive ? "Inativar plano" : "Ativar plano";
                const toggleTarget = isActive ? "inativo" : "ativo";
                const allowToggle = plan.publication_state !== "arquivado";
                const orderValue = Number(plan.display_order || 1);

                return `<tr>
                    <td>${escapeHtml(plan.code)}</td>
                    <td>
                        <div class="d-flex col gap-1">
                            <strong>${escapeHtml(getSystemLabel(plan.system))} - ${escapeHtml(plan.base_name || plan.name || "-")}</strong>
                            <span class="text-caption text-muted">${escapeHtml(plan.context || "-")}</span>
                        </div>
                    </td>
                    <td>${escapeHtml(getSystemLabel(plan.system))}</td>
                    <td>${formatMoneyValue(plan.monthly_amount)}</td>
                    <td>${formatMoneyValue(plan.annual_amount)}</td>
                    <td><span class="status-pill ${publicationClass}">${escapeHtml(publicationLabel)}</span></td>
                    <td><span class="status-pill ${getStatusTone(plan.status)}">${escapeHtml(getStatusLabel(plan.status))}</span></td>
                    <td>
                        <div class="plan-order-cell">
                            <input class="plan-order-input" type="number" min="1" step="1" value="${orderValue}" data-plan-order-input="${escapeHtml(plan.id)}">
                            <button class="icon-button" type="button" data-plan-action="save-order" data-plan-id="${escapeHtml(plan.id)}" title="Salvar ordem" aria-label="Salvar ordem">
                                <img src="${iconBasePath}Upload-Square-3--Streamline-Ultimate.png" alt="">
                            </button>
                        </div>
                    </td>
                    <td class="voucher-actions">
                        ${allowToggle
                            ? `<button class="icon-button" type="button" data-plan-action="toggle-status" data-plan-id="${escapeHtml(plan.id)}" data-plan-target="${toggleTarget}" title="${toggleTitle}" aria-label="${toggleTitle}">
                                <img src="${iconBasePath}${toggleIcon}" alt="">
                            </button>`
                            : ""}
                        <button class="icon-button icon-button-danger" type="button" data-plan-action="delete" data-plan-id="${escapeHtml(plan.id)}" title="Excluir plano" aria-label="Excluir plano">
                            <img src="${iconBasePath}Remove-Square-1--Streamline-Ultimate.png" alt="">
                        </button>
                    </td>
                </tr>`;
            }).join("");
        }

        async function loadPlans() {
            planList.innerHTML = '<tr><td colspan="9">Carregando planos...</td></tr>';
            const rows = await api.request("/backoffice/plans");
            renderPlans(rows);
        }

        function syncCode() {
            code.value = normalizeCode();
        }

        name.addEventListener("input", syncCode);
        system.addEventListener("change", syncCode);
        monthly.addEventListener("input", () => {
            monthly.value = formatInputMoney(monthly.value);
            syncAnnual();
        });
        monthly.addEventListener("blur", syncAnnual);
        syncAnnual();

        planList.addEventListener("click", async (event) => {
            const button = event.target.closest("button[data-plan-action]");
            if (!button) return;

            const id = button.dataset.planId;
            const plan = mockPlans.find((item) => item.id === id);
            if (!plan) return;

            if (button.dataset.planAction === "save-order") {
                const input = planList.querySelector(`input[data-plan-order-input="${CSS.escape(id)}"]`);
                const nextOrder = Math.max(1, Number(input?.value || plan.display_order || 1));
                await api.request(`/backoffice/plans/${id}`, { method: "PATCH", body: { display_order: nextOrder } });
                setMessage(`Ordem atualizada para ${nextOrder}.`, "success");
                await loadPlans();
                return;
            }

            if (button.dataset.planAction === "toggle-status") {
                const nextStatus = button.dataset.planTarget || (plan.status === "ativo" ? "inativo" : "ativo");
                const nextLabel = getStatusLabel(nextStatus).toLowerCase();
                if (!window.confirm(`Alternar este plano para ${nextLabel}?`)) return;
                await api.request(`/backoffice/plans/${id}`, { method: "PATCH", body: { status: nextStatus } });
                setMessage(`Plano atualizado para ${nextLabel}.`, "success");
                await loadPlans();
                return;
            }

            if (button.dataset.planAction === "delete") {
                await api.request(`/backoffice/plans/${id}`, { method: "DELETE" });
                setMessage("Plano excluído com sucesso.", "success");
                await loadPlans();
            }
        });

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            const payload = {
                base_name: name.value.trim(),
                name: `${getSystemLabel(system.value)} - ${name.value.trim()}`,
                code: code.value.trim() || normalizeCode(),
                status: "inativo",
                system: system.value,
                publication_state: "rascunho",
                technical_description: technicalDescription.value.trim(),
                commercial_content: commercialContent.value.trim(),
                monthly_amount: parseInputMoney(monthly.value),
                annual_amount: parseInputMoney(annual.value),
                display_order: (Math.max(...mockPlans.map((plan) => Number(plan.display_order || 0))) || 0) + 1,
            };

            await api.request("/backoffice/plans", { method: "POST", body: payload });
            setMessage("Plano cadastrado com sucesso.", "success");
            form.reset();
            code.value = "";
            annual.value = "";
            await loadPlans();
        });

        form.addEventListener("reset", () => {
            window.setTimeout(() => {
                code.value = "";
                annual.value = "";
                message.hidden = true;
                message.textContent = "";
                delete message.dataset.tone;
                syncCode();
                syncAnnual();
            }, 0);
        });

        loadPlans();
    })();
</script>
