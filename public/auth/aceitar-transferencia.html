<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aceitar administração | Fokus Cloud</title><link rel="stylesheet" href="/src/assets/css/reset.css"><link rel="stylesheet" href="/src/assets/css/style.css"></head><body><main class="checkout-wrap"><section class="auth-card"><a class="brand" href="/">Fokus<span>Cloud</span></a><h1>Aceitar administração</h1><p>Ao confirmar, você se torna o único administrador desta empresa.</p><button id="accept" class="btn btn-green">Aceitar transferência</button><p id="message" role="status"></p></section></main><script src="/assets/js/api-client.js"></script><script>accept.onclick=async()=>{try{const r=await FokusApi.request('/auth/accept-admin-transfer',{method:'POST',body:{token:new URLSearchParams(location.search).get('token')}});message.textContent=r.message;setTimeout(()=>location='/portal',1000)}catch(e){message.textContent=e.message}}</script></body></html>
