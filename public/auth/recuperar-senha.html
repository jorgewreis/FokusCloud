<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Recuperar senha | Fokus Cloud</title>
    <link rel="stylesheet" href="/src/assets/css/reset.css" />
    <link rel="stylesheet" href="/src/assets/css/style.css" />
    <link rel="stylesheet" href="/src/assets/css/subscription.css" />
  </head>
  <body class="subscription-page">
    <main class="checkout-wrap">
      <section class="auth-card">
        <a class="brand" href="/acesso">Fokus<span>Cloud</span></a>
        <div class="card-heading">
          <p class="section-kicker">Recuperação de acesso</p>
          <h1 class="card-title">Redefina sua senha.</h1>
          <p class="card-description">Informe seu CPF. Se houver uma conta elegível, enviaremos um link ao e-mail já confirmado.</p>
        </div>
        <form id="reset-form">
          <label class="form-field"><span class="form-label">CPF</span><input class="field-size-md" name="cpf" inputmode="numeric" autocomplete="username" required /></label>
        </form>
        <div class="login-actions"><button class="btn btn-green" form="reset-form" type="submit">Enviar instruções</button></div>
        <p id="message" class="form-message" role="status"></p>
      </section>
    </main>
    <script src="/assets/js/api-client.js"></script>
    <script>
      document.querySelector('#reset-form').onsubmit = async (event) => {
        event.preventDefault();
        const form = event.currentTarget;
        const cpf = form.elements.cpf.value.replace(/\D/g, '');
        try {
          const response = await FokusApi.request('/auth/request-password-reset', { method: 'POST', body: { cpf } });
          document.querySelector('#message').textContent = response.message;
          form.reset();
        } catch (error) { document.querySelector('#message').textContent = error.message; }
      };
    </script>
  </body>
</html>
