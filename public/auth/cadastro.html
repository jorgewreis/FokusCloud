<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Criar empresa | Fokus Cloud</title>
    <link rel="stylesheet" href="/src/assets/css/reset.css" />
    <link rel="stylesheet" href="/src/assets/css/style.css" />
    <link rel="stylesheet" href="/src/assets/css/subscription.css?v=20260807-16" />
  </head>
  <body class="subscription-page">
    <main class="checkout-wrap">
      <section class="auth-card">
        <a class="brand" href="/">Fokus<span>Cloud</span></a>
        <div class="card-heading">
          <p class="section-kicker">Cadastro inicial</p>
          <h1 class="card-title">Crie sua empresa.</h1>
          <p class="card-description">Informe os dados da empresa e do administrador responsável.</p>
        </div>
        <form id="register-form">
          <label class="form-field">
            <span class="form-label">Tipo de documento</span>
            <select class="field-size-md" name="document_type" id="document-type">
              <option value="cnpj">CNPJ</option>
              <option value="cpf">CPF</option>
            </select>
          </label>
          <label class="form-field">
            <span class="form-label">CPF ou CNPJ</span>
            <input class="field-size-md" id="company-document" name="document_number" inputmode="numeric" required aria-describedby="company-document-error" />
            <span id="company-document-error" class="field-error" role="alert"></span>
          </label>
          <label class="form-field" id="company-name-label">
            <span class="form-label" id="company-name-label-text">Razão social</span>
            <input class="field-size-md" name="legal_name" required />
          </label>
          <label class="form-field">
            <span class="form-label">Nome completo do administrador</span>
            <input class="field-size-md" name="name" required />
          </label>
          <label class="form-field">
            <span class="form-label">CPF do administrador</span>
            <input class="field-size-md" id="admin-cpf" name="cpf" inputmode="numeric" required aria-describedby="admin-cpf-error" />
            <span id="admin-cpf-error" class="field-error" role="alert"></span>
          </label>
          <label class="form-field">
            <span class="form-label">E-mail profissional</span>
            <input class="field-size-md" name="email" type="email" required />
          </label>
          <label class="form-field">
            <span class="form-label">Senha</span>
            <input class="field-size-md" name="password" type="password" minlength="12" required />
          </label>
          <label class="consent-field">
            <input type="checkbox" name="terms" required />
            <span>Li e aceito os Termos de Uso.</span>
          </label>
          <label class="consent-field">
            <input type="checkbox" name="privacy" required />
            <span>Li e aceito a Política de Privacidade.</span>
          </label>
        </form>
        <div class="login-actions"><button class="btn btn-green" form="register-form" type="submit">Criar conta</button></div>
        <p id="feedback" class="form-message" role="status"></p>
      </section>
    </main>
    <script src="/assets/js/api-client.js"></script>
    <script>
      const type = document.querySelector('#document-type');
      const companyNameLabel = document.querySelector('#company-name-label-text');
      const companyDocument = document.querySelector('#company-document');
      const adminCpf = document.querySelector('#admin-cpf');
      const form = document.querySelector('#register-form');
      const feedback = document.querySelector('#feedback');

      const digits = (value) => value.replace(/\D/g, '');
      const repeatedDigits = (value) => /^(\d)\1+$/.test(value);
      const validCpf = (value) => {
        const cpf = digits(value);
        if (cpf.length !== 11 || repeatedDigits(cpf)) return false;
        const digit = (length) => {
          const sum = cpf.slice(0, length).split('').reduce((total, number, index) => total + Number(number) * (length + 1 - index), 0);
          const remainder = (sum * 10) % 11;
          return remainder === 10 ? 0 : remainder;
        };
        return digit(9) === Number(cpf[9]) && digit(10) === Number(cpf[10]);
      };
      const validCnpj = (value) => {
        const cnpj = digits(value);
        if (cnpj.length !== 14 || repeatedDigits(cnpj)) return false;
        const digit = (length) => {
          let factor = length === 12 ? 5 : 6;
          const sum = cnpj.slice(0, length).split('').reduce((total, number) => {
            const result = total + Number(number) * factor;
            factor = factor === 2 ? 9 : factor - 1;
            return result;
          }, 0);
          const remainder = sum % 11;
          return remainder < 2 ? 0 : 11 - remainder;
        };
        return digit(12) === Number(cnpj[12]) && digit(13) === Number(cnpj[13]);
      };
      const validateDocument = (input, documentType, errorId) => {
        const error = document.querySelector(errorId);
        const value = digits(input.value);
        const valid = documentType === 'cnpj' ? validCnpj(value) : validCpf(value);
        if (!value || valid) {
          input.value = value;
          input.removeAttribute('aria-invalid');
          error.textContent = '';
          error.classList.remove('is-visible');
          return true;
        }
        input.value = '';
        input.setAttribute('aria-invalid', 'true');
        error.textContent = `${documentType.toUpperCase()} inválido. Confira os dígitos e informe novamente.`;
        error.classList.add('is-visible');
        return false;
      };

      type.onchange = () => {
        companyNameLabel.textContent = type.value === 'cpf' ? 'Nome completo' : 'Razão social';
        companyDocument.value = '';
        companyDocument.removeAttribute('aria-invalid');
        document.querySelector('#company-document-error').classList.remove('is-visible');
      };
      companyDocument.onblur = () => validateDocument(companyDocument, type.value, '#company-document-error');
      adminCpf.onblur = () => validateDocument(adminCpf, 'cpf', '#admin-cpf-error');
      form.onsubmit = async (event) => {
        event.preventDefault();
        const companyValid = validateDocument(companyDocument, type.value, '#company-document-error');
        const cpfValid = validateDocument(adminCpf, 'cpf', '#admin-cpf-error');
        if (!companyValid || !cpfValid) return;
        const values = Object.fromEntries(new FormData(event.currentTarget));
        try {
          await FokusApi.request('/auth/register-company', {
            method: 'POST',
            body: { ...values, terms_version: '1.0', privacy_version: '1.0' },
          });
          location.href = '/verificar-email';
        } catch (error) {
          feedback.textContent = error.message;
        }
      };
    </script>
  </body>
</html>
