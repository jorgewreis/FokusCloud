<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Criar empresa | Fokus Cloud</title><link rel="stylesheet" href="/src/assets/css/reset.css"><link rel="stylesheet" href="/src/assets/css/style.css"><link rel="stylesheet" href="/src/assets/css/subscription.css"></head>
<body class="subscription-page"><main class="checkout-wrap"><section class="auth-card"><a class="brand" href="/">Fokus<span>Cloud</span></a><p>CADASTRO INICIAL</p><h1>Crie sua empresa.</h1><form id="register-form"><label>Tipo de documento<select name="document_type" id="document-type"><option value="cnpj">CNPJ</option><option value="cpf">CPF</option></select></label><label>CPF ou CNPJ<input name="document_number" inputmode="numeric" required></label><label id="company-name-label">Razão social<input name="legal_name" required></label><label>Nome completo do administrador<input name="name" required></label><label>CPF do administrador<input name="cpf" inputmode="numeric" required></label><label>E-mail profissional<input name="email" type="email" required></label><label>Senha<input name="password" type="password" minlength="12" required></label><label><input type="checkbox" name="terms" required> Li e aceito os Termos de Uso.</label><label><input type="checkbox" name="privacy" required> Li e aceito a Política de Privacidade.</label><button class="btn btn-green" type="submit">Criar conta <span>→</span></button></form><p id="feedback" role="status"></p></section></main><script src="/assets/js/api-client.js"></script><script>const type=document.querySelector('#document-type'), label=document.querySelector('#company-name-label');type.onchange=()=>label.firstChild.textContent=type.value==='cpf'?'Nome completo':'Razão social';document.querySelector('#register-form').onsubmit=async e=>{e.preventDefault();const v=Object.fromEntries(new FormData(e.currentTarget));try{await FokusApi.request('/auth/register-company',{method:'POST',body:JSON.stringify({...v,terms_version:'1.0',privacy_version:'1.0'})});location.href='/verificar-email'}catch(err){document.querySelector('#feedback').textContent=err.message}};</script></body></html>
