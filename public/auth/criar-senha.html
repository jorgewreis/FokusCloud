<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Definir senha | Fokus Cloud</title>
    <link rel="stylesheet" href="/src/assets/css/reset.css" />
    <link rel="stylesheet" href="/src/assets/css/style.css" />
  </head>
  <body>
    <main class="checkout-wrap">
      <section class="auth-card">
        <a class="brand" href="/">Fokus<span>Cloud</span></a>
        <h1>Defina sua senha</h1>
        <p>Escolha uma senha com pelo menos 12 caracteres para concluir o acesso.</p>
        <form id="form">
          <label class="form-field"><span class="form-label">Nova senha</span><input name="password" type="password" minlength="12" required /></label>
          <label class="form-field"><span class="form-label">Confirme a senha</span><input name="password_confirmation" type="password" minlength="12" required /></label>
          <button class="btn btn-green">Salvar senha</button>
        </form>
        <p id="message" role="status"></p>
      </section>
    </main>
    <script src="/assets/js/api-client.js"></script>
    <script>
      document.querySelector('#form').onsubmit = async (event) => {
        event.preventDefault();
        const data = Object.fromEntries(new FormData(event.target));
        data.token = new URLSearchParams(location.search).get('token');
        try {
          const response = await window.FokusApi.request('/auth/set-password', { method: 'POST', body: data });
          message.textContent = response.message;
          setTimeout(() => location = '/acesso', 1000);
        } catch (error) {
          message.textContent = error.message;
        }
      };
    </script>
  </body>
</html>
