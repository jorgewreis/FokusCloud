<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acesso interno | Fokus Cloud</title><link rel="stylesheet" href="/src/assets/css/reset.css"><link rel="stylesheet" href="/src/assets/css/style.css"><link rel="stylesheet" href="/src/assets/css/subscription.css"></head><body class="subscription-page"><main class="checkout-wrap"><section class="auth-card"><a class="brand" href="/">Fokus<span>Cloud</span></a><p>ACESSO RESTRITO</p><h1>Backoffice</h1><form id="login"><label>E-mail interno<input name="email" type="email" autocomplete="username" required></label><label>Senha<input name="password" type="password" autocomplete="current-password" required></label><button class="btn btn-green">Continuar</button></form><form id="mfa" hidden><p>Informe o código de seis dígitos enviado ao seu e-mail.</p><label>Código<input name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required></label><button class="btn btn-green">Validar acesso</button></form><p id="message" role="status"></p></section></main><script src="/assets/js/api-client.js"></script><script>const message=document.querySelector('#message'),login=document.querySelector('#login'),mfa=document.querySelector('#mfa');login.onsubmit=async e=>{e.preventDefault();try{await FokusApi.request('/backoffice/auth/login',{method:'POST',body:Object.fromEntries(new FormData(login))});login.hidden=true;mfa.hidden=false;message.textContent='Código enviado.'}catch(error){message.textContent=error.message}};mfa.onsubmit=async e=>{e.preventDefault();try{await FokusApi.request('/backoffice/auth/verify-mfa',{method:'POST',body:Object.fromEntries(new FormData(mfa))});location='/backoffice'}catch(error){message.textContent=error.message}};</script></body></html>
