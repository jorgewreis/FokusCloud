<div class="plan-page d-flex col">
    <div class="col gap-3 mb-3">
        <h1 class="text-display-4">Catálogo</h1>
        <p class="text-heading-5 text-muted">Gerencie sistemas, funcionalidades, planos, composição e publicação do catálogo comercial.</p>
    </div>

    <hr>

    <div class="form-panel">
        <div class="form-actions">
            <button class="button button-secondary" type="button" data-catalog-tab="products">Produtos</button>
            <button class="button button-secondary" type="button" data-catalog-tab="modules">Funcionalidades</button>
            <button class="button button-secondary" type="button" data-catalog-tab="plans">Planos</button>
            <button class="button button-secondary" type="button" data-catalog-tab="publish">Publicação</button>
        </div>
        <div class="system-notice" id="catalog-message" role="status" aria-live="polite" aria-atomic="true" hidden></div>
    </div>

    <section class="catalog-section" data-catalog-panel="products">
        <form class="fc-form form-panel" id="product-form">
            <div class="form-line">
                <div class="form-field w-3"><label for="product-code">Código</label><input id="product-code" name="code" type="text" required></div>
                <div class="form-field w-5"><label for="product-name">Nome</label><input id="product-name" name="name" type="text" required></div>
                <div class="form-field w-2"><label for="product-status">Status</label><select id="product-status" name="status"><option value="ativo">Ativo</option><option value="inativo">Inativo</option></select></div>
                <div class="form-field w-2"><label for="product-order">Ordem</label><input id="product-order" name="display_order" type="number" min="0" step="1" value="1"></div>
            </div>
            <div class="form-line">
                <div class="form-field w-6"><label for="product-technical-description">Descrição técnica</label><textarea id="product-technical-description" name="technical_description"></textarea></div>
                <div class="form-field w-6"><label for="product-commercial-content">Conteúdo comercial</label><textarea id="product-commercial-content" name="commercial_content"></textarea></div>
            </div>
            <div class="form-actions"><button class="submit" type="submit">Salvar produto</button><button class="button button-secondary" type="reset">Novo produto</button></div>
        </form>
        <div class="table-panel"><table class="data-table" aria-label="Produtos do catálogo"><thead><tr><th>Código</th><th>Nome</th><th>Status</th><th>Publicação</th><th>Ordem</th><th>Versão</th><th>Ações</th></tr></thead><tbody id="product-list"><tr><td colspan="7">Carregando...</td></tr></tbody></table></div>
    </section>

    <section class="catalog-section" data-catalog-panel="modules" hidden>
        <form class="fc-form form-panel" id="module-form">
            <div class="form-line">
                <div class="form-field w-3"><label for="module-product">Produto</label><select id="module-product" name="product_id" required></select></div>
                <div class="form-field w-3"><label for="module-code">Código</label><input id="module-code" name="code" type="text" required></div>
                <div class="form-field w-3"><label for="module-core">Módulo técnico</label><input id="module-core" name="module_code" type="text" required></div>
                <div class="form-field w-3"><label for="module-name">Nome</label><input id="module-name" name="name" type="text" required></div>
            </div>
            <div class="form-line">
                <div class="form-field w-3"><label for="module-price">Preço mensal</label><input id="module-price" name="monthly_price" type="text" inputmode="decimal" class="money-input" required></div>
                <div class="form-field w-3"><label for="module-segment">Segmento</label><input id="module-segment" name="segment_code" type="text"></div>
                <div class="form-field w-3"><label for="module-context">Contexto</label><input id="module-context" name="context_code" type="text"></div>
                <div class="form-field w-3"><label for="module-status">Status</label><select id="module-status" name="status"><option value="ativo">Ativo</option><option value="rascunho">Rascunho</option><option value="pausado">Pausado</option><option value="arquivado">Arquivado</option></select></div>
            </div>
            <div class="form-line">
                <div class="form-field w-6"><label for="module-dependencies">Dependências</label><input id="module-dependencies" name="dependencies" type="text" placeholder="contatos, processos"></div>
                <div class="form-field w-6"><label for="module-incompatibilities">Incompatibilidades</label><input id="module-incompatibilities" name="incompatibilities" type="text" placeholder="codigo-a, codigo-b"></div>
            </div>
            <div class="form-actions"><button class="submit" type="submit">Salvar funcionalidade</button><button class="button button-secondary" type="reset">Nova funcionalidade</button></div>
        </form>
        <div class="table-panel"><table class="data-table" aria-label="Funcionalidades do catálogo"><thead><tr><th>Código</th><th>Nome</th><th>Produto</th><th>Preço</th><th>Status</th><th>Publicação</th><th>Ações</th></tr></thead><tbody id="module-list"><tr><td colspan="7">Carregando...</td></tr></tbody></table></div>
    </section>

    <section class="catalog-section" data-catalog-panel="plans" hidden>
        <form class="fc-form form-panel" id="plan-form">
            <div class="form-line">
                <div class="form-field w-3"><label for="plan-product">Produto</label><select id="plan-product" name="product_id" required></select></div>
                <div class="form-field w-3"><label for="plan-code">Código</label><input id="plan-code" name="code" type="text" required></div>
                <div class="form-field w-3"><label for="plan-name">Nome-base</label><input id="plan-name" name="base_name" type="text" required></div>
                <div class="form-field w-3"><label for="plan-status">Status</label><select id="plan-status" name="status"><option value="ativo">Ativo</option><option value="inativo">Inativo</option></select></div>
            </div>
            <div class="form-line">
                <div class="form-field w-3"><label for="plan-segment">Segmento</label><input id="plan-segment" name="segment" type="text"></div>
                <div class="form-field w-3"><label for="plan-monthly">Valor mensal</label><input id="plan-monthly" name="monthly_amount" type="text" inputmode="decimal" class="money-input"></div>
                <div class="form-field w-3"><label for="plan-order">Ordem</label><input id="plan-order" name="display_order" type="number" min="0" step="1" value="1"></div>
                <div class="form-field w-3"><label for="plan-featured">Destaque</label><select id="plan-featured" name="featured"><option value="0">Não</option><option value="1">Sim</option></select></div>
            </div>
            <div class="form-field"><label>Composição</label><div class="form-panel" id="plan-module-options"></div></div>
            <div class="form-actions"><button class="submit" type="submit">Salvar plano</button><button class="button button-secondary" type="reset">Novo plano</button></div>
        </form>
        <div class="table-panel"><table class="data-table" aria-label="Planos do catálogo"><thead><tr><th>Código</th><th>Plano</th><th>Produto</th><th>Mensal</th><th>Módulos</th><th>Status</th><th>Publicação</th><th>Ações</th></tr></thead><tbody id="plan-list"><tr><td colspan="8">Carregando...</td></tr></tbody></table></div>
    </section>

    <section class="catalog-section" data-catalog-panel="publish" hidden>
        <form class="fc-form form-panel" id="publish-form">
            <div class="form-line">
                <div class="form-field w-4"><label for="publish-product">Produto</label><select id="publish-product" name="product_id" required></select></div>
                <div class="form-field w-8"><label for="publish-reason">Motivo</label><input id="publish-reason" name="reason" type="text" maxlength="1000" required></div>
            </div>
            <div class="form-actions"><button class="submit" type="submit">Publicar catálogo</button></div>
        </form>
    </section>
</div>

<script>
    (() => {
        const api = window.FokusApi;
        const state = { catalog: { products: [] }, editing: { product: null, module: null, plan: null } };
        const message = document.querySelector("#catalog-message");
        const money = (value) => Number(value || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
        const parseMoney = (value) => Number(String(value || "").replace(/[^0-9]/g, "")) / 100 || 0;
        const splitCodes = (value) => String(value || "").split(",").map((item) => item.trim()).filter(Boolean);
        const escapeHtml = (value) => String(value ?? "").replace(/[&<>"']/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" }[char]));

        function showMessage(text, tone = "info") {
            message.textContent = text || "";
            message.dataset.tone = tone;
            message.hidden = !text;
        }

        function productOptions(selected = "") {
            return state.catalog.products.map((product) => `<option value="${escapeHtml(product.id)}" ${product.id === selected ? "selected" : ""}>${escapeHtml(product.name)}</option>`).join("");
        }

        function allModules() {
            return state.catalog.products.flatMap((product) => (product.modules || []).map((module) => ({ ...module, product_name: product.name })));
        }

        function allPlans() {
            return state.catalog.products.flatMap((product) => (product.plans || []).map((plan) => ({ ...plan, product_name: product.name })));
        }

        function renderSelects() {
            ["#module-product", "#plan-product", "#publish-product"].forEach((selector) => {
                const select = document.querySelector(selector);
                select.innerHTML = productOptions(select.value);
            });
        }

        function renderPlanModuleOptions(selected = []) {
            const productId = document.querySelector("#plan-product").value;
            const modules = allModules().filter((module) => module.product_id === productId);
            document.querySelector("#plan-module-options").innerHTML = modules.length ? modules.map((module) => `<label class="consent-field"><input type="checkbox" name="module_ids" value="${escapeHtml(module.id)}" ${selected.includes(module.id) ? "checked" : ""}><span>${escapeHtml(module.name)} - ${money(module.monthly_amount || module.monthly_price)}</span></label>`).join("") : '<p class="text-body text-muted">Cadastre funcionalidades ativas para compor planos.</p>';
        }

        function render() {
            renderSelects();
            document.querySelector("#product-list").innerHTML = state.catalog.products.length ? state.catalog.products.map((product) => `<tr><td>${escapeHtml(product.code)}</td><td>${escapeHtml(product.name)}</td><td>${escapeHtml(product.status)}</td><td>${escapeHtml(product.publication_state)}</td><td><input class="plan-order-input" type="number" min="0" step="1" value="${Number(product.display_order || 0)}" data-product-order-input="${escapeHtml(product.id)}"></td><td>${product.published_version || 0}</td><td><button class="button button-secondary" type="button" data-edit-product="${escapeHtml(product.id)}">Editar</button><button class="button button-secondary" type="button" data-save-product-order="${escapeHtml(product.id)}">Salvar ordem</button></td></tr>`).join("") : '<tr><td colspan="7">Nenhum produto cadastrado.</td></tr>';
            document.querySelector("#module-list").innerHTML = allModules().length ? allModules().map((module) => `<tr><td>${escapeHtml(module.code)}</td><td>${escapeHtml(module.name)}</td><td>${escapeHtml(module.product_name)}</td><td>${money(module.monthly_amount || module.monthly_price)}</td><td>${escapeHtml(module.status)}</td><td>${escapeHtml(module.publication_state)}</td><td><button class="button button-secondary" type="button" data-edit-module="${escapeHtml(module.id)}">Editar</button></td></tr>`).join("") : '<tr><td colspan="7">Nenhuma funcionalidade cadastrada.</td></tr>';
            renderPlanModuleOptions();
            document.querySelector("#plan-list").innerHTML = allPlans().length ? allPlans().map((plan) => `<tr><td>${escapeHtml(plan.code)}</td><td>${escapeHtml(plan.full_name || plan.name)}</td><td>${escapeHtml(plan.product_name)}</td><td>${money(plan.monthly_amount)}</td><td>${plan.modules_count || (plan.modules || []).length}</td><td>${escapeHtml(plan.status)}</td><td>${escapeHtml(plan.publication_state)}</td><td><button class="button button-secondary" type="button" data-edit-plan="${escapeHtml(plan.id)}">Editar</button></td></tr>`).join("") : '<tr><td colspan="8">Nenhum plano cadastrado.</td></tr>';
            window.FokusForm?.enhance(document.querySelector(".plan-page"));
        }

        async function loadCatalog() {
            try {
                if (!api) throw new Error("API do Backoffice indisponível.");
                state.catalog = await api.request("/backoffice/catalog");
                render();
                showMessage("");
            } catch (error) {
                showMessage(error.message || "Não foi possível carregar o catálogo.", "danger");
            }
        }

        document.querySelectorAll("[data-catalog-tab]").forEach((button) => {
            button.addEventListener("click", () => {
                document.querySelectorAll("[data-catalog-panel]").forEach((panel) => {
                    panel.hidden = panel.dataset.catalogPanel !== button.dataset.catalogTab;
                });
            });
        });
        document.querySelector("#plan-product").addEventListener("change", () => renderPlanModuleOptions());

        document.querySelector("#product-form").addEventListener("submit", async (event) => {
            event.preventDefault();
            const payload = Object.fromEntries(new FormData(event.currentTarget));
            payload.display_order = Number(payload.display_order || 0);
            const id = state.editing.product;
            await api.request(id ? `/backoffice/catalog/products/${id}` : "/backoffice/catalog/products", { method: id ? "PATCH" : "POST", body: payload });
            event.currentTarget.reset();
            state.editing.product = null;
            showMessage("Produto salvo.", "success");
            await loadCatalog();
        });

        document.querySelector("#module-form").addEventListener("submit", async (event) => {
            event.preventDefault();
            const payload = Object.fromEntries(new FormData(event.currentTarget));
            payload.monthly_price = parseMoney(payload.monthly_price);
            payload.dependencies = splitCodes(payload.dependencies);
            payload.incompatibilities = splitCodes(payload.incompatibilities);
            const id = state.editing.module;
            await api.request(id ? `/backoffice/catalog/modules/${id}` : "/backoffice/catalog/modules", { method: id ? "PATCH" : "POST", body: payload });
            event.currentTarget.reset();
            state.editing.module = null;
            showMessage("Funcionalidade salva.", "success");
            await loadCatalog();
        });

        document.querySelector("#plan-form").addEventListener("submit", async (event) => {
            event.preventDefault();
            const payload = Object.fromEntries(new FormData(event.currentTarget));
            payload.monthly_amount = payload.monthly_amount ? parseMoney(payload.monthly_amount) : null;
            payload.display_order = Number(payload.display_order || 0);
            payload.featured = payload.featured === "1";
            payload.module_ids = [...event.currentTarget.querySelectorAll('input[name="module_ids"]:checked')].map((input) => input.value);
            const id = state.editing.plan;
            await api.request(id ? `/backoffice/catalog/plans/${id}` : "/backoffice/catalog/plans", { method: id ? "PATCH" : "POST", body: payload });
            event.currentTarget.reset();
            state.editing.plan = null;
            showMessage("Plano salvo.", "success");
            await loadCatalog();
        });

        document.querySelector("#publish-form").addEventListener("submit", async (event) => {
            event.preventDefault();
            const payload = Object.fromEntries(new FormData(event.currentTarget));
            if (!window.confirm("Publicar a versão atual deste catálogo?")) return;
            const response = await api.request(`/backoffice/catalog/${payload.product_id}/publish`, { method: "POST", body: { reason: payload.reason } });
            showMessage(`Catálogo publicado na versão ${response.version}.`, "success");
            await loadCatalog();
        });

        document.addEventListener("click", async (event) => {
            const productId = event.target.closest("[data-edit-product]")?.dataset.editProduct;
            const productOrderId = event.target.closest("[data-save-product-order]")?.dataset.saveProductOrder;
            const moduleId = event.target.closest("[data-edit-module]")?.dataset.editModule;
            const planId = event.target.closest("[data-edit-plan]")?.dataset.editPlan;
            if (productOrderId) {
                const input = document.querySelector(`[data-product-order-input="${CSS.escape(productOrderId)}"]`);
                await api.request(`/backoffice/catalog/products/${productOrderId}`, { method: "PATCH", body: { display_order: Number(input?.value || 0) } });
                showMessage("Ordem do produto salva.", "success");
                await loadCatalog();
            }
            if (productId) {
                const product = state.catalog.products.find((item) => item.id === productId);
                state.editing.product = productId;
                ["code", "name", "status", "display_order", "technical_description", "commercial_content"].forEach((key) => {
                    const field = document.querySelector(`#product-form [name="${key}"]`);
                    if (field) field.value = product[key] ?? "";
                });
            }
            if (moduleId) {
                const module = allModules().find((item) => item.id === moduleId);
                state.editing.module = moduleId;
                ["product_id", "code", "module_code", "name", "segment_code", "context_code", "status"].forEach((key) => {
                    const field = document.querySelector(`#module-form [name="${key}"]`);
                    if (field) field.value = module[key] ?? "";
                });
                document.querySelector("#module-price").value = money(module.monthly_amount || module.monthly_price);
                document.querySelector("#module-dependencies").value = (module.dependencies || []).join(", ");
                document.querySelector("#module-incompatibilities").value = (module.incompatibilities || []).join(", ");
            }
            if (planId) {
                const plan = allPlans().find((item) => item.id === planId);
                state.editing.plan = planId;
                ["product_id", "code", "segment", "status", "display_order"].forEach((key) => {
                    const field = document.querySelector(`#plan-form [name="${key}"]`);
                    if (field) field.value = plan[key] ?? "";
                });
                document.querySelector("#plan-name").value = plan.base_name || plan.name;
                document.querySelector("#plan-featured").value = plan.featured ? "1" : "0";
                document.querySelector("#plan-monthly").value = money(plan.monthly_amount);
                renderPlanModuleOptions((plan.modules || []).map((module) => module.id));
            }
        });

        loadCatalog();
    })();
</script>
