<div class="subscriptions-page d-flex col gap-3">
    <div class="col gap-1"><h1 class="text-display-4">Assinaturas</h1><p class="text-heading-5 text-muted">Consulte contratos, pagamentos, histórico e ações comerciais.</p></div>
    <p id="subscription-message" class="form-message" role="status" hidden></p>
    <form class="fc-form form-panel" id="subscription-filter-form">
        <div class="form-line align-end">
            <div class="form-field w-6"><label for="subscription-query">Buscar</label><input id="subscription-query" name="q" type="search" placeholder="Empresa ou produto" autocomplete="off"></div>
            <div class="form-field w-3"><label for="subscription-status">Status</label><select id="subscription-status" name="status"><option value="">Todos</option><option value="aguardando_pagamento">Aguardando pagamento</option><option value="ativa">Ativa</option><option value="inadimplente">Inadimplente</option><option value="suspensa">Suspensa</option><option value="cancelamento_agendado">Cancelamento agendado</option><option value="encerrada">Encerrada</option></select></div>
            <div class="form-actions w-3"><button class="btn btn-green" type="submit">Filtrar</button></div>
        </div>
    </form>
    <div class="table-container"><table class="table"><thead><tr><th>Empresa</th><th>Produto</th><th>Plano</th><th>Status</th><th>Vigência</th><th>Valor</th><th></th></tr></thead><tbody id="subscription-list"><tr><td colspan="7">Carregando assinaturas...</td></tr></tbody></table></div>
    <nav id="subscription-pagination" class="pagination catalog-pagination" aria-label="Paginação de assinaturas"></nav>

    <section class="form-panel" id="subscription-detail" hidden aria-live="polite">
        <div class="d-flex justify-between align-center gap-3"><div class="col gap-1"><h2 class="text-heading-3" id="subscription-detail-title"></h2><p class="text-body text-muted" id="subscription-detail-summary"></p></div><button class="btn btn-outline" id="subscription-detail-close" type="button">Fechar</button></div>
        <div class="col gap-2 mt-3"><h3 class="text-heading-4">Itens contratados</h3><div id="subscription-detail-items"></div></div>
        <div class="col gap-2 mt-3"><h3 class="text-heading-4">Histórico comercial</h3><div id="subscription-detail-history"></div></div>
        <form class="fc-form form-panel mt-3" id="subscription-change-form">
            <h3 class="text-heading-4">Registrar ação comercial</h3>
            <div class="form-line"><div class="form-field w-4"><label for="subscription-action">Ação</label><select id="subscription-action" name="action" required><option value="">Selecione</option><option value="suspensao">Suspender</option><option value="reativacao">Reativar</option><option value="cancelamento">Agendar cancelamento</option><option value="upgrade">Solicitar upgrade</option><option value="downgrade">Agendar downgrade</option><option value="override">Override comercial</option></select></div><div class="form-field w-8"><label for="subscription-reason">Motivo</label><textarea id="subscription-reason" name="reason" rows="2" required maxlength="1000"></textarea></div></div>
            <div class="form-line" id="subscription-target-fields" hidden><div class="form-field w-6"><label for="subscription-target-plan">Plano de destino</label><select id="subscription-target-plan" name="target_plan_id"><option value="">Carregando planos...</option></select></div><div class="form-field w-3"><label for="subscription-cycle">Ciclo</label><select id="subscription-cycle" name="billing_cycle"><option value="monthly">Mensal</option><option value="annual">Anual</option></select></div></div>
            <div class="form-line" id="subscription-override-fields" hidden><div class="form-field w-4"><label for="subscription-override-amount">Valor mensal</label><input id="subscription-override-amount" name="override_monthly_amount" type="number" min="0" step="0.01" inputmode="decimal"></div><div class="form-field w-4"><label for="subscription-override-cycle">Ciclo do override</label><select id="subscription-override-cycle" name="override_billing_cycle"><option value="monthly">Mensal</option><option value="annual">Anual</option></select></div></div>
            <div class="form-actions"><button class="btn btn-green" type="submit">Registrar ação</button></div>
        </form>
    </section>
</div>

<script>
(() => {
    const api = window.FokusApi;
    const state = { page: 1, query: "", status: "", current: null, plans: [] };
    const list = document.querySelector("#subscription-list");
    const pagination = document.querySelector("#subscription-pagination");
    const detail = document.querySelector("#subscription-detail");
    const message = document.querySelector("#subscription-message");
    const escapeHtml = (value) => String(value ?? "").replace(/[&<>'"]/g, (char) => ({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#039;","\"":"&quot;"}[char]));
    const money = (value) => `R$ ${Number(value || 0).toFixed(2).replace(".", ",")}`;
    const showMessage = (value, tone = "danger") => { message.textContent = value || ""; message.dataset.tone = tone; message.hidden = !value; };
    const renderPagination = (meta) => { if (!meta || meta.last_page <= 1) { pagination.innerHTML = meta ? `<span class="pagination-info">${meta.total} assinaturas</span>` : ""; return; } pagination.innerHTML = `<span class="pagination-info">Página ${meta.current_page} de ${meta.last_page} · ${meta.total} assinaturas</span>${Array.from({length: meta.last_page}, (_, i) => i + 1).map((page) => `<button class="pagination-item${page === meta.current_page ? " is-active" : ""}" type="button" data-subscription-page="${page}">${page}</button>`).join("")}`; };
    const loadPlans = async () => { try { const catalog = await api.request("/backoffice/catalog"); state.plans = (catalog.products || []).flatMap((product) => (product.plans || []).map((plan) => ({ ...plan, product_name: product.name }))); document.querySelector("#subscription-target-plan").innerHTML = state.plans.map((plan) => `<option value="${escapeHtml(plan.id)}">${escapeHtml(plan.full_name || plan.name)}</option>`).join("") || '<option value="">Nenhum plano disponível</option>'; } catch (error) { showMessage(error.message || "Não foi possível carregar os planos."); } };
    const load = async () => { try { const params = new URLSearchParams({ page: String(state.page), per_page: "25" }); if (state.query) params.set("q", state.query); if (state.status) params.set("status", state.status); const response = await api.request(`/backoffice/subscriptions?${params}`); list.innerHTML = response.data?.length ? response.data.map((item) => `<tr><td>${escapeHtml(item.company_name)}</td><td>${escapeHtml(item.product_name)}</td><td>${escapeHtml(item.plan_name || "-")}</td><td><span class="badge">${escapeHtml(item.status)}</span></td><td>${item.current_period_ends_at ? new Date(item.current_period_ends_at).toLocaleDateString("pt-BR") : "-"}</td><td>${money(item.amount)}</td><td><button class="btn btn-outline btn-sm" type="button" data-subscription-id="${escapeHtml(item.id)}">Detalhes</button></td></tr>`).join("") : '<tr><td colspan="7">Nenhuma assinatura encontrada.</td></tr>'; renderPagination(response.meta); showMessage(""); } catch (error) { showMessage(error.message || "Não foi possível carregar as assinaturas."); } };
    const renderDetail = (subscription) => { state.current = subscription; document.querySelector("#subscription-detail-title").textContent = `${subscription.company_name} · ${subscription.product_name}`; document.querySelector("#subscription-detail-summary").textContent = `${subscription.plan_name || "Plano não informado"} · ${subscription.status} · ${subscription.billing_cycle || "-"} · ${money(subscription.amount)}`; document.querySelector("#subscription-detail-items").innerHTML = subscription.items?.length ? `<ul>${subscription.items.map((item) => `<li>${escapeHtml(item.name)} · ${item.quantity} × ${money(item.unit_price)}</li>`).join("")}</ul>` : '<p class="text-body text-muted">Nenhum item ativo.</p>'; document.querySelector("#subscription-detail-history").innerHTML = subscription.history?.length ? subscription.history.map((item) => `<article class="card"><div class="d-flex justify-between"><strong>${escapeHtml(item.type)}</strong><span class="badge">${escapeHtml(item.status)}</span></div><p>${escapeHtml(item.reason || "Sem motivo")}</p><p class="text-caption text-muted">${item.created_at ? new Date(item.created_at).toLocaleString("pt-BR") : "-"}</p></article>`).join("") : '<p class="text-body text-muted">Nenhuma alteração registrada.</p>'; detail.hidden = false; detail.scrollIntoView({ behavior: "smooth", block: "start" }); };
    document.querySelector("#subscription-filter-form").addEventListener("submit", (event) => { event.preventDefault(); const data = new FormData(event.currentTarget); state.query = data.get("q")?.trim() || ""; state.status = data.get("status") || ""; state.page = 1; load(); });
    pagination.addEventListener("click", (event) => { const button = event.target.closest("[data-subscription-page]"); if (!button) return; state.page = Number(button.dataset.subscriptionPage); load(); });
    list.addEventListener("click", async (event) => { const button = event.target.closest("[data-subscription-id]"); if (!button) return; try { renderDetail(await api.request(`/backoffice/subscriptions/${button.dataset.subscriptionId}`)); } catch (error) { showMessage(error.message || "Não foi possível carregar a assinatura."); } });
    document.querySelector("#subscription-detail-close").addEventListener("click", () => { detail.hidden = true; });
    document.querySelector("#subscription-action").addEventListener("change", (event) => { const target = ["upgrade", "downgrade"].includes(event.target.value); document.querySelector("#subscription-target-fields").hidden = !target; document.querySelector("#subscription-override-fields").hidden = event.target.value !== "override"; });
    document.querySelector("#subscription-change-form").addEventListener("submit", async (event) => { event.preventDefault(); if (!state.current) return; const form = event.currentTarget; if (window.FokusForm && !FokusForm.validate(form)) return; const data = new FormData(form); const action = data.get("action"); const body = { action, reason: data.get("reason") }; if (["upgrade", "downgrade"].includes(action)) { body.target_plan_id = data.get("target_plan_id"); body.billing_cycle = data.get("billing_cycle"); } if (action === "override") body.override = { monthly_amount: Number(data.get("override_monthly_amount")), billing_cycle: data.get("override_billing_cycle") }; try { await api.request(`/backoffice/subscriptions/${state.current.id}`, { method: "PATCH", body }); showMessage("Ação comercial registrada.", "success"); form.reset(); document.querySelector("#subscription-target-fields").hidden = true; document.querySelector("#subscription-override-fields").hidden = true; renderDetail(await api.request(`/backoffice/subscriptions/${state.current.id}`)); load(); } catch (error) { showMessage(error.message || "Não foi possível registrar a ação."); } });
    loadPlans();
    load();
})();
</script>
