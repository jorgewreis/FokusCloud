<section class="security-page d-flex col">
    <div class="col gap-3 mb-3">
        <h1 class="text-display-4">Seguranca e perfis</h1>
        <p class="text-heading-5 text-muted">Gerencie contas internas, papeis e eventos de acesso do Backoffice.</p>
    </div>

    <hr>

    <div class="form-panel">
        <div class="form-actions">
            <button class="button" id="invite-admin" type="button">Convidar administrador</button>
        </div>
    </div>

    <div class="system-notice" id="security-message" hidden></div>
    <div class="table-panel">
        <table class="data-table">
            <thead><tr><th>Administrador</th><th>Perfil</th><th>Status</th><th>Ultimo acesso</th><th>Acoes</th></tr></thead>
            <tbody id="admins-body"></tbody>
        </table>
    </div>
    <div id="invite-dialog" role="dialog" aria-modal="false" aria-labelledby="invite-dialog-title" aria-hidden="true">
        <form class="fc-form dialog-panel card card-static form-panel invite-admin-card" id="invite-form" novalidate>
            <div class="title dialog-header" id="invite-dialog-title">Convidar administrador</div>
            <div class="content dialog-content stack m-3">
                <div class="form-field"><label for="admin-name">Nome</label><input class="form-input-text" id="admin-name" name="name" required></div>
                <div class="form-field"><label for="admin-email">E-mail</label><input class="form-input-text" id="admin-email" name="email" type="email" required></div>
                <div class="form-field"><label for="admin-role">Perfil</label><select class="form-select" id="admin-role" name="role" required><option value="administrador_comercial">Administrador comercial</option><option value="superadministrador">Superadministrador</option></select></div>
                <div class="form-actions"><button class="button" type="submit">Enviar convite</button><button class="button button-secondary" id="close-invite" type="button">Cancelar</button></div>
            </div>
        </form>
    </div>
    <script>
        (() => {
            const api = window.FokusApi;
            const body = document.querySelector("#admins-body");
            const notice = document.querySelector("#security-message");
            const dialog = document.querySelector("#invite-dialog");
            const openDialog = () => { dialog.classList.add("is-open"); dialog.setAttribute("aria-hidden", "false"); dialog.setAttribute("aria-modal", "true"); document.querySelector("#admin-name").focus(); };
            const closeDialog = () => { dialog.classList.remove("is-open"); dialog.setAttribute("aria-hidden", "true"); dialog.setAttribute("aria-modal", "false"); };
            const iconBasePath = "/backoffice/assets/icons/";
            const escapeHtml = (value) => String(value || "").replace(/[&<>"']/g, (character) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"})[character]);
            const message = (text, tone = "info") => { notice.hidden = false; notice.dataset.tone = tone; notice.textContent = text; };
            const actionButton = (action, id, label, icon, danger = false) => `<button class="icon-button${danger ? " icon-button-danger" : ""}" type="button" data-action="${action}" data-id="${escapeHtml(id)}" title="${label}" aria-label="${label}"><img src="${iconBasePath}${icon}" alt=""></button>`;
            async function load() {
                try {
                    const [{ admins }, { admin: currentAdmin }] = await Promise.all([api.request("/backoffice/admins"), api.request("/backoffice/auth/me")]);
                    const canManage = (currentAdmin?.permissions || []).includes("platform.security.manage");
                    body.innerHTML = admins.map((admin) => {
                        const isBlocked = ["bloqueado", "bloqueio_temporario"].includes(admin.status);
                        const actions = canManage
                            ? `${isBlocked ? actionButton("unblock", admin.id, "Desbloquear", "Single-Man-Actions-Key--Streamline-Ultimate.png") : admin.status === "ativo" ? actionButton("block", admin.id, "Bloquear", "Single-Man-Actions-Lock--Streamline-Ultimate.png") : ""}${admin.status !== "desativado" ? actionButton("deactivate", admin.id, "Desativar", "Single-Man-Actions-Block--Streamline-Ultimate.png", true) : ""}`
                            : "";
                        return `<tr><td>${escapeHtml(admin.name)}<br><small class="text-muted">${escapeHtml(admin.email)}</small></td><td>${escapeHtml(admin.role)}</td><td>${escapeHtml(admin.status)}</td><td>${admin.last_login_at ? new Date(admin.last_login_at).toLocaleString("pt-BR") : "-"}</td><td class="voucher-actions">${actions}</td></tr>`;
                    }).join("");
                } catch (error) { message(error.message || "Nao foi possivel carregar as contas internas.", "danger"); }
            }
            document.querySelector("#invite-admin").addEventListener("click", openDialog);
            document.querySelector("#close-invite").addEventListener("click", closeDialog);
            document.addEventListener("keydown", (event) => { if (event.key === "Escape" && dialog.classList.contains("is-open")) closeDialog(); });
            document.querySelector("#invite-form").addEventListener("submit", async (event) => { event.preventDefault(); const form = event.currentTarget; if (window.FokusForm && !FokusForm.validate(form)) return; FokusForm?.setLoading(form, true); try { const data = await api.request("/backoffice/admins/invitations", { method: "POST", body: Object.fromEntries(new FormData(form)) }); closeDialog(); form.reset(); message(data.message, "success"); load(); } catch (error) { FokusForm?.mapServerErrors(form, error.errors); message(error.message || "Nao foi possivel enviar o convite.", "danger"); } finally { FokusForm?.setLoading(form, false); } });
            body.addEventListener("click", async (event) => { const button = event.target.closest("button[data-action]"); if (!button) return; const reason = prompt("Informe o motivo desta acao:"); if (!reason) return; try { const data = await api.request(`/backoffice/admins/${button.dataset.id}/${button.dataset.action}`, { method: "POST", body: { reason } }); message(data.message, "success"); load(); } catch (error) { message(error.message || "Acao nao permitida.", "danger"); } });
            load();
        })();
    </script>
</section>
