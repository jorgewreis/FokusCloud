<div class="company-page d-flex col">
    <div class="fs-col fs-u-gap-3 fs-u-mb-3"><h1 class="text-display-4">Interesses de produtos</h1><p class="text-heading-5 fs-u-color-secondary">Diagnósticos recebidos para o Fokus Law e o Fokus Lead.</p></div><hr>
    <div id="interest-message" class="system-notice" role="status" aria-live="polite" hidden></div>
    <form class="fc-form form-panel" id="interest-filter-form"><div class="form-line align-end"><div class="form-field"><label for="interest-product-filter">Produto</label><select id="interest-product-filter" name="product"><option value="">Todos</option><option value="law">Fokus Law</option><option value="lead">Fokus Lead</option></select></div><div class="form-field"><label for="interest-profile-filter">Perfil</label><input id="interest-profile-filter" name="profile" placeholder="Ex.: Advocacia"></div><div class="form-field"><label for="interest-status-filter">Status</label><select id="interest-status-filter" name="status"><option value="">Todos</option><option value="novo">Novo</option><option value="contatado">Contatado</option><option value="qualificado">Qualificado</option><option value="arquivado">Arquivado</option></select></div><div class="form-actions"><button class="submit" type="submit">Filtrar</button></div></div></form>
    <div class="table-panel"><table class="data-table is-responsive" aria-label="Interesses de produtos"><thead><tr><th>Nome</th><th>E-mail</th><th>Produtos</th><th>Perfil</th><th>Status</th><th>Último envio</th><th></th></tr></thead><tbody id="interest-list"><tr><td colspan="7">Carregando interesses...</td></tr></tbody></table></div><nav id="interest-pagination" class="fs-pagination catalog-pagination" aria-label="Paginação de interesses"></nav>
    <section class="form-panel" id="interest-detail" hidden aria-live="polite"><div class="fs-u-d-flex fs-u-justify-content-between align-center fs-u-gap-3"><div class="fs-col fs-u-gap-1"><h2 class="text-heading-3" id="interest-detail-name"></h2><p class="text-body fs-u-color-secondary" id="interest-detail-email"></p></div><button class="fs-btn button-secondary" id="interest-detail-close" type="button">Fechar</button></div><div id="interest-detail-content" class="fs-col fs-u-gap-2 fs-u-mt-3"></div></section>
</div>
<script>
(() => { const api = window.FokusApi; const state = { page: 1, filters: {} }; const list = document.querySelector("#interest-list"); const pagination = document.querySelector("#interest-pagination"); const message = document.querySelector("#interest-message"); const detail = document.querySelector("#interest-detail"); const esc = (v) => String(v ?? "").replace(/[&<>'"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#039;","\"":"&quot;"}[c])); const status = (v) => `<span class="fs-badge ${v === "qualificado" ? "badge-success" : v === "arquivado" ? "badge-neutral" : v === "contatado" ? "badge-info" : "badge-warning"}">${esc(v)}</span>`; const show = (v, tone = "danger") => { message.textContent = v || ""; message.dataset.tone = tone; message.hidden = !v; }; const pages = (meta) => { pagination.innerHTML = !meta || meta.last_page <= 1 ? `<span class="pagination-info">${meta?.total || 0} interesses</span>` : `<span class="pagination-info">Página ${meta.current_page} de ${meta.last_page} · ${meta.total} interesses</span>${Array.from({length: meta.last_page}, (_, i) => i + 1).map((p) => `<button class="pagination-item${p === meta.current_page ? " is-active" : ""}" type="button" data-interest-page="${p}">${p}</button>`).join("")}`; }; const render = (response) => { list.innerHTML = response.data.length ? response.data.map((item) => `<tr><td data-label="Nome">${esc(item.name)}</td><td data-label="E-mail">${esc(item.email)}</td><td data-label="Produtos">${esc((item.products || []).join(", "))}</td><td data-label="Perfil">${esc((item.profiles || []).join(", "))}</td><td data-label="Status">${status(item.status)}</td><td data-label="Último envio">${new Date(item.last_submitted_at).toLocaleString("pt-BR")}</td><td><button class="fs-btn button-secondary fs-btn-sm" type="button" data-interest-id="${esc(item.id)}">Detalhes</button></td></tr>`).join("") : '<tr><td colspan="7">Nenhum interesse encontrado.</td></tr>'; pages(response.meta); }; const load = async () => { try { const params = new URLSearchParams({ page: state.page, per_page: 25, ...state.filters }); render(await api.request(`/backoffice/product-interests?${params}`)); show(""); } catch (error) { show(error.message); } }; const detailHtml = (item) => `<div class="grid-2 fs-u-gap-3"><div><strong>Produtos</strong><p>${esc((item.products || []).join(", "))}</p></div><div><strong>Perfil</strong><p>${esc((item.profiles || []).join(", "))}</p></div><div><strong>Organização</strong><p>${esc(item.organization || "-")}</p></div><div><strong>Localização</strong><p>${esc([item.city, item.state].filter(Boolean).join(" / ") || "-")}</p></div><div><strong>Equipe</strong><p>${esc(item.team_size || "-")}</p></div><div><strong>Consentimento</strong><p>Versão ${esc(item.privacy_version)} · ${new Date(item.consented_at).toLocaleString("pt-BR")}</p></div></div><div><strong>Processo atual</strong><p>${esc(item.current_process || "-")}</p></div><div><strong>Principais dificuldades</strong><p>${esc(item.main_difficulties || "-")}</p></div><div><strong>Módulos</strong><p>${esc((item.modules || []).join(", ") || "-")}</p></div><form id="interest-status-form" class="form-line align-end"><div class="form-field"><label for="interest-detail-status">Status</label><select id="interest-detail-status" name="status"><option value="novo">Novo</option><option value="contatado">Contatado</option><option value="qualificado">Qualificado</option><option value="arquivado">Arquivado</option></select></div><button class="submit" type="submit">Salvar status</button></form>`; document.querySelector("#interest-filter-form").addEventListener("submit", (e) => { e.preventDefault(); state.filters = Object.fromEntries([...new FormData(e.currentTarget)].filter(([, v]) => v)); state.page = 1; load(); }); pagination.addEventListener("click", (e) => { const b = e.target.closest("[data-interest-page]"); if (b) { state.page = Number(b.dataset.interestPage); load(); } }); list.addEventListener("click", async (e) => { const b = e.target.closest("[data-interest-id]"); if (!b) return; try { const item = (await api.request(`/backoffice/product-interests/${b.dataset.interestId}`)).interest; document.querySelector("#interest-detail-name").textContent = item.name; document.querySelector("#interest-detail-email").textContent = item.email; document.querySelector("#interest-detail-content").innerHTML = detailHtml(item); document.querySelector("#interest-detail-status").value = item.status; detail.hidden = false; detail.dataset.id = item.id; detail.scrollIntoView({ behavior: "smooth" }); } catch (error) { show(error.message); } }); document.querySelector("#interest-detail-content").addEventListener("submit", async (e) => { if (e.target.id !== "interest-status-form") return; e.preventDefault(); try { await api.request(`/backoffice/product-interests/${detail.dataset.id}`, { method: "PATCH", body: Object.fromEntries(new FormData(e.target)) }); show("Status atualizado.", "success"); load(); } catch (error) { show(error.message); } }); document.querySelector("#interest-detail-close").addEventListener("click", () => { detail.hidden = true; }); load(); })();
</script>
