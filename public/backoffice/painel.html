<!DOCTYPE html>
<html lang="pt-BR" data-theme="light" data-role="admin">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title></title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <!-- IMPORT CSS -->
        <link rel="stylesheet" href="/assets/manual/css/main.css">
    </head>
    <body>

        <div class="container-page expanded">

            <div class="sidebar expanded" id="sidebar">
                <div class="top">
                    <button class="sidebar-button" id="sidebar-expand" type="button" aria-controls="sidebar" aria-expanded="false">
                        <img src="/assets/manual/icons/Sidebar-Expand--Streamline-Ultimate.png" alt="">
                        <span class="sidebar-button-label title">Fokus<strong>Admin</strong></span>
                    </button>
                    <div class="line-hr-single"></div>
                </div>

                <nav class="content sidebar-nav" aria-label="Navegação administrativa">
                    <button class="sidebar-button active" type="button" data-sidebar-item="platform-dashboard">
                        <img src="/assets/manual/icons/Layout-Dashboard-1--Streamline-Ultimate.png">
                        <span class="sidebar-button-label text-subtitle-sm">Painel geral</span>
                    </button>
                    <button class="sidebar-button" type="button" data-sidebar-item="companies">
                        <img src="/assets/manual/icons/Small-Office-Tall-Building--Streamline-Ultimate.png">
                        <span class="sidebar-button-label text-subtitle-sm">Empresas</span>
                    </button>
                    <button class="sidebar-button" type="button" data-sidebar-item="subscription-plans">
                        <img src="/assets/manual/icons/Customer-Relationship-Management-List-Document-Share--Streamline-Ultimate.png">
                        <span class="sidebar-button-label text-subtitle-sm">Planos</span>
                    </button>
                    <button class="sidebar-button" type="button" data-sidebar-item="subscriptions">
                        <img src="/assets/manual/icons/Seo-Search--Streamline-Ultimate.png">
                        <span class="sidebar-button-label text-subtitle-sm">Assinaturas</span>
                    </button>
                    <button class="sidebar-button" type="button" data-sidebar-item="vouchers">
                        <img src="/assets/manual/icons/Tickets--Streamline-Ultimate.png">
                        <span class="sidebar-button-label text-subtitle-sm">Vouchers</span>
                    </button>
                    <button class="sidebar-button" type="button" data-sidebar-item="platform-users">
                        <img src="/assets/manual/icons/Multiple-Actions-Setting--Streamline-Ultimate.png">
                        <span class="sidebar-button-label text-subtitle-sm">Admins</span>
                    </button>
                </nav>

                <div class="bottom">
                    <div class="line-hr-single"></div>
                    <div class="sidebar-button">
                        <img src="/assets/manual/icons/Cog--Streamline-Ultimate.png">
                        <span class="sidebar-button-label text-subtitle-sm text-muted">Configurações</span>
                    </div>
                    <div class="sidebar-button">
                        <img src="/assets/manual/icons/Settings-User--Streamline-Ultimate.png">
                        <div class="d-flex col">
                            <span class="sidebar-button-label text-caption text-muted">Administrador logado</span>
                            <span class="sidebar-button-label text-subtitle-sm text-primary" id="admin-name">Jorge Reis</span>
                        </div>
                        <img class="mini-icon" id="logout" src="/assets/manual/icons/Download-Square-3--Streamline-Ultimate.png">
                    </div>
                </div>

            </div>

            <!-- PAGE CONTENT -->
            <div class="container-content" id="page-content">
            </div>
        </div>

    <script src="/assets/js/api-client.js"></script>
    <script>
        function sidebarHide() {
            let sidebar = document.querySelector(".sidebar");
            let icon = document.querySelector("#sidebar-expand img");
            let button = document.querySelector("#sidebar-expand");
            let isSingle = sidebar.classList.contains("single");
            let container = document.querySelector(".container-page");

            if (isSingle) {
                sidebar.classList.replace("single", "expanded");
                container.classList.replace("single", "expanded");
                icon.setAttribute("src", "/assets/manual/icons/Sidebar-Expand--Streamline-Ultimate.png");
                button.setAttribute("aria-expanded", "true");
            } else {
                container.classList.replace("expanded", "single");
                sidebar.classList.replace("expanded", "single");
                icon.setAttribute("src", "/assets/manual/icons/Sidebar-Collapes--Streamline-Ultimate.png");
                button.setAttribute("aria-expanded", "false");
            }
        }

        document.querySelector("#sidebar-expand").addEventListener("click", sidebarHide);
    </script>

    <script>
        const pageContent = document.querySelector("#page-content");
        const sidebarButtons = document.querySelectorAll("[data-sidebar-item]");
        const pagePath = "/backoffice/admin-pages";
        const routePageMap = {
            painel: "platform-dashboard",
            empresas: "companies",
            assinaturas: "subscriptions",
            vouchers: "vouchers",
        };

        function runPageScripts(container) {
            container.querySelectorAll("script").forEach((script) => {
                const nextScript = document.createElement("script");
                nextScript.textContent = script.textContent;
                script.replaceWith(nextScript);
            });
        }

        async function loadSidebarPage(pageName) {
            pageContent.innerHTML = '<div class="text-body text-muted">Carregando...</div>';

            try {
                const response = await fetch(`${pagePath}/${pageName}.html`);

                if (!response.ok) {
                    throw new Error(`Pagina nao encontrada: ${pageName}`);
                }

                pageContent.innerHTML = await response.text();
                runPageScripts(pageContent);

                sidebarButtons.forEach((button) => {
                    button.classList.toggle(
                        "active",
                        button.dataset.sidebarItem === pageName
                    );
                });
            } catch (error) {
                pageContent.innerHTML = "";
                sidebarButtons.forEach((button) => {
                    button.classList.toggle(
                        "active",
                        button.dataset.sidebarItem === pageName
                    );
                });
                console.error(error);
            }
        }

        sidebarButtons.forEach((button) => {
            button.addEventListener("click", () => {
                loadSidebarPage(button.dataset.sidebarItem);
            });
        });

        async function hydrateAdmin() {
            try {
                const response = await FokusApi.request("/backoffice/auth/me");
                if (response?.admin?.name) {
                    document.querySelector("#admin-name").textContent = response.admin.name;
                }
            } catch (error) {
                location.replace("/backoffice/acesso");
            }
        }

        document.querySelector("#logout").addEventListener("click", async () => {
            await FokusApi.request("/backoffice/auth/logout", { method: "POST" });
            location.replace("/backoffice/acesso");
        });

        hydrateAdmin();
        loadSidebarPage(routePageMap[location.pathname.split("/").filter(Boolean).pop()] || "platform-dashboard");
    </script>
        
    </body>
</html>
