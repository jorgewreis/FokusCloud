<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Ativar acesso | Fokus Cloud</title><link rel="stylesheet" href="/backoffice/assets/css/main.css"></head>
<body class="auth-shell" data-theme="light" data-role="admin">
  <main class="auth-panel">
    <header class="stack stack-sm"><h1 class="text-heading-2">Ativar acesso interno</h1><p class="text-body text-muted">Defina uma senha segura para concluir seu convite.</p></header>
    <form class="fc-form stack" id="activation">
      <div class="form-field"><label class="form-label form-label-required" for="password">Nova senha</label><input class="form-input-text" id="password" name="password" type="password" minlength="12" autocomplete="new-password" required><small class="form-help" id="password-help">Use pelo menos 12 caracteres.</small></div>
      <div class="form-field"><label class="form-label form-label-required" for="password_confirmation">Confirme a senha</label><input class="form-input-text" id="password_confirmation" name="password_confirmation" type="password" minlength="12" autocomplete="new-password" aria-describedby="password-help" required></div>
      <div class="form-actions"><button class="submit" type="submit">Ativar conta</button></div>
    </form>
    <div class="system-notice" id="message" role="alert" aria-live="polite" aria-atomic="true"></div>
  </main>
  <script src="/assets/js/api-client.js"></script>
  <script src="/backoffice/assets/js/form-system.js"></script>
  <script>
    const form = document.querySelector("#activation");
    const message = document.querySelector("#message");
    const token = new URLSearchParams(location.search).get("token");
    form.addEventListener("submit", async (event) => { event.preventDefault(); if (!FokusForm.validate(form)) return; FokusForm.setLoading(form, true); try { const data = await FokusApi.request("/backoffice/auth/activate-invitation", { method: "POST", body: { ...Object.fromEntries(new FormData(form)), token } }); message.dataset.tone = "success"; message.textContent = data.message; setTimeout(() => location.replace("/backoffice/acesso"), 1200); } catch (error) { message.dataset.tone = "danger"; message.textContent = error.message || "Nao foi possivel ativar a conta."; } finally { FokusForm.setLoading(form, false); } });
  </script>
</body>
</html>
