<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portal do cliente | Fokus Cloud</title><link rel="stylesheet" href="/assets/css/reset.css"><link rel="stylesheet" href="/assets/css/dashboard.css"></head><body class="dashboard-page"><div class="dashboard-shell"><aside class="dashboard-side"><a class="brand" href="/portal">Fokus<span>Cloud</span></a><nav><a class="active" href="/portal">Visão geral</a><a href="/portal/assinaturas">Assinaturas</a><a href="/portal/usuarios">Usuários</a><a href="/portal/empresas">Empresas</a><a href="/portal/perfil">Meu perfil</a></nav><button id="logout" class="dashboard-button secondary">Sair</button></aside><main class="dashboard-main"><header class="dashboard-top"><div><p>PORTAL DO CLIENTE</p><h1 id="welcome">Olá</h1></div><p id="company">Carregando empresa...</p></header><section class="metric-grid"><article class="metric-card"><span>Assinaturas ativas</span><strong id="subscriptions">—</strong></article><article class="metric-card"><span>Seu perfil na empresa</span><strong id="role">—</strong></article><article class="metric-card"><span>Próxima cobrança</span><strong id="renewal">—</strong></article><article class="metric-card"><span>Ações disponíveis</span><strong id="actions">—</strong></article></section><section class="dashboard-panel"><h2>Atalhos</h2><div class="dashboard-toolbar"><a class="dashboard-button" href="/portal/assinaturas">Gerenciar assinaturas</a><a class="dashboard-button secondary" href="/portal/usuarios">Gerenciar usuários</a><a class="dashboard-button secondary" href="/portal/perfil">Atualizar perfil</a></div><p id="message" class="dashboard-empty"></p></section></main></div><script src="/assets/js/api-client.js"></script><script>(async()=>{try{const me=await FokusApi.request('/auth/me');if(!me.user.email_verified){location='/verificar-email';return}if(!me.active_company_id){location='/portal/empresas';return}const company=me.companies.find(c=>c.id===me.active_company_id);welcome.textContent=`Olá, ${me.user.name}`;company && (document.querySelector('#company').textContent=company.name);role.textContent=company?.role||'—';actions.textContent=company?.role==='admin'?'Gestão completa':'Perfil e produtos';const subs=await FokusApi.request('/subscriptions');subscriptions.textContent=subs.filter(s=>s.status==='ativa').length;const next=subs.filter(s=>s.current_period_ends_at).sort((a,b)=>new Date(a.current_period_ends_at)-new Date(b.current_period_ends_at))[0];renewal.textContent=next?new Date(next.current_period_ends_at).toLocaleDateString('pt-BR'):'—';if(company?.role!=='admin')document.querySelector('a[href="/portal/usuarios"]').hidden=true}catch(e){message.textContent=e.message;setTimeout(()=>location='/acesso',900)}})();logout.onclick=async()=>{await FokusApi.request('/auth/logout',{method:'POST'});location='/'};</script></body></html>
