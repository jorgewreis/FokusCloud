<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Assinaturas | Fokus Cloud</title>
    <link rel="stylesheet" href="/assets/css/reset.css" />
    <link rel="stylesheet" href="/assets/css/style.css" />
    <link rel="stylesheet" href="/assets/css/subscription.css" />
  </head>
  <body class="subscription-page">
    <main class="checkout-wrap">
      <section class="auth-card">
        <a class="brand" href="/portal">Fokus<span>Cloud</span></a>
        <p>ASSINATURAS DA EMPRESA</p>
        <h1>Assinaturas e pagamentos</h1>
        <p id="message" role="status">Carregando suas assinaturas...</p>
        <div id="subscriptions" class="admin-list"></div>
        <div class="review-actions">
          <a class="btn btn-green" href="/assinaturas/fokus-law">Assinar Fokus Law</a>
          <a class="btn btn-outline" href="/assinaturas/fokus-lead">Assinar Fokus Lead</a>
        </div>
      </section>
    </main>
    <script src="/assets/js/api-client.js"></script>
    <script>
      const message = document.querySelector('#message');
      const list = document.querySelector('#subscriptions');
      (async () => {
        try {
          const subscriptions = await FokusApi.request('/subscriptions');
          if (!subscriptions.length) {
            message.textContent = 'Esta empresa ainda não possui assinaturas.';
            return;
          }
          message.textContent = '';
          list.innerHTML = subscriptions.map((item) => {
            const total = item.payment ? Number(item.payment.amount).toLocaleString('pt-BR', { style: 'currency', currency: item.payment.currency || 'BRL' }) : '—';
            const period = item.current_period_ends_at ? `<p>Vigência até: <b>${new Date(item.current_period_ends_at).toLocaleDateString('pt-BR')}</b></p>` : '';
            const cancel = item.cancel_at ? `<p>Cancelamento agendado para ${new Date(item.cancel_at).toLocaleDateString('pt-BR')}.</p>` : `<button class="btn btn-outline" data-cancel="${item.id}">Cancelar ao fim do ciclo</button>`;
            return `<article class="admin-list-item"><h2>${item.product_name}</h2><p>Status da assinatura: <b>${item.status}</b></p>${period}<p>Pagamento: <b>${item.payment?.status || 'pendente'}</b> — ${total}</p><ul>${item.items.map((entry) => `<li>${entry.name} (${entry.quantity}x)</li>`).join('')}</ul><div class="review-actions">${cancel}</div></article>`;
          }).join('');
          document.querySelectorAll('[data-cancel]').forEach((button) => button.onclick = async () => {
            if (!confirm('A assinatura permanecerá ativa até o fim do ciclo já pago. Deseja continuar?')) return;
            try { const response = await FokusApi.request(`/subscriptions/${button.dataset.cancel}/change`, { method: 'POST', body: { type: 'cancelamento' } }); message.textContent = response.message; location.reload(); } catch (error) { message.textContent = error.message; }
          });
        } catch (error) {
          message.textContent = error.message;
          if (error.message.includes('sessão') || error.message.includes('Unauthenticated')) location.assign('/acesso');
        }
      })();
    </script>
  </body>
</html>
