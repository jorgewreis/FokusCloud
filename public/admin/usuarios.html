<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Usuários | Fokus Cloud</title><link rel="stylesheet" href="/src/assets/css/reset.css"><link rel="stylesheet" href="/src/assets/css/style.css"></head><body><main class="checkout-wrap"><section class="auth-card"><a class="brand" href="/admin">Fokus<span>Cloud</span></a><h1>Usuários da empresa</h1><form id="invite"><label>Nome completo<input name="name" required></label><label>CPF<input name="cpf" required></label><label>E-mail<input type="email" name="email" required></label><label>Perfil<select name="role"><option value="usuario">Usuário</option><option value="gestor">Gestor</option></select></label><button class="btn btn-green">Enviar convite</button></form><p id="message" role="status"></p><div id="list"></div></section></main><script src="/assets/js/api-client.js"></script><script>async function load(){try{const users=await FokusApi.request('/admin/users');list.innerHTML=users.map(u=>`<p><b>${u.name}</b> — ${u.role} — ${u.status}</p>`).join('')}catch(e){location='/admin'}}invite.onsubmit=async e=>{e.preventDefault();try{const r=await FokusApi.request('/admin/users',{method:'POST',body:Object.fromEntries(new FormData(e.target))});message.textContent=r.message;e.target.reset();load()}catch(e){message.textContent=e.message}};load()</script></body></html>
