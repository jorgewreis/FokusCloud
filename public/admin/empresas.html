<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Empresas | Fokus Cloud</title><link rel="stylesheet" href="/src/assets/css/reset.css"><link rel="stylesheet" href="/src/assets/css/style.css"></head><body class="subscription-page"><main class="checkout-wrap"><section class="auth-card"><a class="brand" href="/">Fokus<span>Cloud</span></a><h1>Escolha a empresa</h1><p>Selecione a empresa que será usada nesta sessão.</p><div id="companies"></div><p id="feedback" role="status"></p><a id="login-again" class="btn btn-green" href="/admin" hidden>Entrar novamente</a></section></main><script src="/assets/js/api-client.js"></script><script>(()=>{const allowed=['/assinaturas/fokus-law','/assinaturas/fokus-lead'];const requested=new URLSearchParams(location.search).get('retorno');const destination=allowed.includes(requested)?requested:'/admin/painel';const feedback=document.querySelector('#feedback');(async()=>{try{const me=await FokusApi.request('/auth/me');if(!me.companies.length)throw new Error('Nenhuma empresa ativa está disponível para esta conta.');companies.innerHTML=me.companies.map(c=>`<button class="btn btn-white" data-id="${c.id}">${c.name} — ${c.role}</button>`).join('');document.querySelectorAll('[data-id]').forEach(b=>b.onclick=async()=>{try{await FokusApi.request('/auth/select-company',{method:'POST',body:{company_id:b.dataset.id}});location.assign(destination)}catch(error){feedback.textContent=error.message}})}catch(error){feedback.textContent=error.message||'Sua sessão não está disponível.';document.querySelector('#login-again').hidden=false}})()})()</script></body></html>
