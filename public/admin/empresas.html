<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Empresas | Fokus Cloud</title><link rel="stylesheet" href="/src/assets/css/reset.css"><link rel="stylesheet" href="/src/assets/css/style.css"></head><body><main class="checkout-wrap"><section class="auth-card"><a class="brand" href="/">Fokus<span>Cloud</span></a><h1>Escolha a empresa</h1><p>Selecione a empresa que será usada nesta sessão.</p><div id="companies"></div></section></main><script src="/assets/js/api-client.js"></script><script>(async()=>{try{const me=await FokusApi.request('/auth/me');companies.innerHTML=me.companies.map(c=>`<button class="btn btn-white" data-id="${c.id}">${c.name} — ${c.role}</button>`).join('');document.querySelectorAll('[data-id]').forEach(b=>b.onclick=async()=>{await FokusApi.request('/auth/select-company',{method:'POST',body:{company_id:b.dataset.id}});location='/admin/assinaturas'})}catch(e){location='/admin'}})()</script></body></html>
