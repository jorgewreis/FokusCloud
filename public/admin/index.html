<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Entrar | Fokus Cloud</title>
    <link rel="stylesheet" href="/src/assets/css/reset.css" />
    <link rel="stylesheet" href="/src/assets/css/style.css?v=20260807-21" />
    <link rel="stylesheet" href="/src/assets/css/subscription.css?v=20260807-15" />
  </head>
  <body class="subscription-page">
    <main class="checkout-wrap">
      <section class="auth-card">
        <a class="brand" href="/">Fokus<span>Cloud</span></a>
        <div class="card-heading">
          <p class="section-kicker">Acesso à plataforma</p>
          <h1 class="card-title">Entre na sua conta.</h1>
          <p class="card-description">Use seu CPF ou CNPJ e sua senha para continuar.</p>
        </div>
        <form id="login-form">
          <label><span id="document-label">CPF ou CNPJ</span><input class="field-size-md" id="document" name="document" inputmode="numeric" autocomplete="username" maxlength="18" required /></label>
          <label>Senha<input class="field-size-md" name="password" type="password" autocomplete="current-password" required /></label>
        </form>
        <div class="login-actions">
          <button class="btn btn-green" form="login-form" type="submit">Entrar</button>
          <a class="btn btn-outline" href="/cadastro">Criar conta</a>
        </div>
        <p id="feedback" class="form-message" role="status"></p>
        <a class="auth-recovery-link" href="/recuperar-senha">Esqueci minha senha</a>
      </section>
    </main>
    <script src="/assets/js/api-client.js"></script>
    <script>
      const documentInput = document.querySelector('#document');
      const documentLabel = document.querySelector('#document-label');

      const onlyDigits = (value) => value.replace(/\D/g, '').slice(0, 14);
      const validCpf = (value) => {
        if (value.length !== 11 || /^(\d)\1+$/.test(value)) return false;
        return [9, 10].every((length) => {
          const total = [...value.slice(0, length)].reduce((sum, digit, index) => sum + Number(digit) * (length + 1 - index), 0);
          const check = (total * 10) % 11 % 10;
          return check === Number(value[length]);
        });
      };
      const validCnpj = (value) => {
        if (value.length !== 14 || /^(\d)\1+$/.test(value)) return false;
        return [[12, 5], [13, 6]].every(([length, factor]) => {
          const total = [...value.slice(0, length)].reduce((sum, digit) => {
            const next = sum + Number(digit) * factor;
            factor = factor === 2 ? 9 : factor - 1;
            return next;
          }, 0);
          const check = total % 11 < 2 ? 0 : 11 - total % 11;
          return check === Number(value[length]);
        });
      };
      const formatDocument = (value) => value.length === 11
        ? value.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4')
        : value.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/, '$1.$2.$3/$4-$5');
      const updateDocument = (format = false) => {
        const value = onlyDigits(documentInput.value);
        const type = validCpf(value) ? 'CPF' : validCnpj(value) ? 'CNPJ' : 'CPF ou CNPJ';
        documentLabel.textContent = type;
        if (format && type !== 'CPF ou CNPJ') documentInput.value = formatDocument(value);
        else documentInput.value = value;
      };

      documentInput.addEventListener('input', () => updateDocument());
      documentInput.addEventListener('blur', () => updateDocument(true));

      document.querySelector('#login-form').onsubmit = async (event) => {
        event.preventDefault();
        const feedback = document.querySelector('#feedback');
        feedback.classList.remove('is-error', 'is-success');
        try {
          updateDocument(true);
          const values = Object.fromEntries(new FormData(event.currentTarget));
          values.document = onlyDigits(values.document);
          const data = await FokusApi.request('/auth/login', { method: 'POST', body: values });
          if (!data.user.email_verified) return location.assign('/verificar-email');
          if (!data.companies.length) {
            feedback.textContent = 'Sua conta não possui uma empresa ativa. Solicite o vínculo ao administrador da empresa.';
            return;
          }
          if (data.companies.length > 1) return location.assign('/portal/empresas');
          location.assign('/portal');
        } catch (error) { feedback.textContent = error.message; feedback.classList.add('is-error'); }
      };
    </script>
  </body>
</html>
