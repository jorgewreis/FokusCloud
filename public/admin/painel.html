<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Painel | Fokus Cloud</title>
    <link rel="stylesheet" href="/src/assets/css/reset.css" />
    <link rel="stylesheet" href="/src/assets/css/style.css" />
    <link rel="stylesheet" href="/src/assets/css/subscription.css" />
  </head>
  <body class="subscription-page">
    <main class="checkout-wrap">
      <section class="auth-card">
        <a class="brand" href="/">Fokus<span>Cloud</span></a>
        <p>PAINEL ADMINISTRATIVO</p>
        <h1 id="welcome">Carregando sua empresa...</h1>
        <p id="company"></p>
        <div class="review-actions">
          <a class="btn btn-green" href="/admin/assinaturas">Assinaturas</a>
          <a class="btn btn-outline" href="/admin/usuarios">Usuários</a>
        </div>
        <button id="logout" class="btn btn-outline" type="button">Sair</button>
      </section>
    </main>
    <script src="/assets/js/api-client.js"></script>
    <script>
      (async () => {
        try {
          const data = await FokusApi.request('/auth/me');
          if (!data.user.email_verified) return location.replace('/verificar-email');
          if (data.companies.length > 1 && !data.active_company_id) return location.replace('/admin/empresas');
          const active = data.companies.find((item) => item.id === data.active_company_id) || data.companies[0];
          if (!active) return location.replace('/admin');
          document.querySelector('#welcome').textContent = `Olá, ${data.user.name}.`;
          document.querySelector('#company').textContent = `${active.name} — perfil ${active.role}.`;
        } catch (_) { location.replace('/admin'); }
      })();
      document.querySelector('#logout').onclick = async () => {
        await FokusApi.request('/auth/logout', { method: 'POST' });
        location.replace('/admin');
      };
    </script>
  </body>
</html>
