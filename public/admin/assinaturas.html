<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Assinaturas | Fokus Cloud</title>
    <link rel="stylesheet" href="/src/assets/css/reset.css" />
    <link rel="stylesheet" href="/src/assets/css/style.css" />
    <link rel="stylesheet" href="/src/assets/css/subscription.css" />
  </head>
  <body class="subscription-page">
    <main class="checkout-wrap">
      <section class="auth-card">
        <a class="brand" href="/admin/painel">Fokus<span>Cloud</span></a>
        <p>ASSINATURAS DA EMPRESA</p>
        <h1>Assinaturas e pagamentos</h1>
        <p id="message" role="status">Carregando suas assinaturas...</p>
        <div id="subscriptions" class="admin-list"></div>
        <div class="review-actions">
          <a class="btn btn-green" href="/assinaturas/fokus-law">Assinar Fokus Law</a>
          <a class="btn btn-outline" href="/assinaturas/fokus-lead">Assinar Fokus Lead</a>
        </div>
      </section>
    </main>
    <script src="/assets/js/api-client.js"></script>
    <script>
      const message = document.querySelector('#message');
      const list = document.querySelector('#subscriptions');
      (async () => {
        try {
          const subscriptions = await FokusApi.request('/subscriptions');
          if (!subscriptions.length) {
            message.textContent = 'Esta empresa ainda não possui assinaturas.';
            return;
          }
          message.textContent = '';
          list.innerHTML = subscriptions.map((item) => {
            const total = item.payment ? Number(item.payment.amount).toLocaleString('pt-BR', { style: 'currency', currency: item.payment.currency || 'BRL' }) : '—';
            return `<article class="admin-list-item"><h2>${item.product_name}</h2><p>Status da assinatura: <b>${item.status}</b></p><p>Pagamento: <b>${item.payment?.status || 'pendente'}</b> — ${total}</p><ul>${item.items.map((entry) => `<li>${entry.name} (${entry.quantity}x)</li>`).join('')}</ul></article>`;
          }).join('');
        } catch (error) {
          message.textContent = error.message;
          if (error.message.includes('sessão') || error.message.includes('Unauthenticated')) location.assign('/admin');
        }
      })();
    </script>
  </body>
</html>
