# Add these location blocks inside the Fokus Cloud HTTPS server block using
# CloudPanel > site > Vhost. They must appear before the generic PHP/static
# location so NGINX redirects legacy physical files instead of serving them.
location = /index.html { return 301 /; }
location = /src/pages/ { return 301 /produtos/fokus-law#planos; }
location = /src/pages/fokus-law.html { return 301 /produtos/fokus-law; }
location = /src/pages/fokus-lead.html { return 301 /produtos/fokus-lead; }
location = /src/pages/fokus-law-assinatura.html { return 301 /assinaturas/fokus-law; }
location = /src/pages/fokus-lead-assinatura.html { return 301 /assinaturas/fokus-lead; }

location = /auth/cadastro.html { return 301 /cadastro; }
location = /auth/verificar-email.html { return 301 /verificar-email; }
location = /auth/criar-senha.html { return 301 /criar-senha; }
location = /auth/aceitar-vinculo.html { return 301 /aceitar-vinculo; }
location = /auth/aceitar-transferencia.html { return 301 /aceitar-transferencia; }

location = /admin/empresas.html { return 301 /admin/empresas; }
location = /admin/usuarios.html { return 301 /admin/usuarios; }
location = /admin/assinaturas.html { return 301 /admin/assinaturas; }
