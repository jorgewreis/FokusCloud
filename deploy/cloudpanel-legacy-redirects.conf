# Add these location blocks inside the Fokus Cloud HTTPS server block using
# CloudPanel > site > Vhost. They must appear before the generic PHP/static
# location so NGINX redirects legacy physical files instead of serving them.
location = /index.html { return 301 /; }
location = /src/pages/ { return 301 /produtos/fokus-law#planos; }
location = /src/pages/fokus-law.html { return 301 /produtos/fokus-law; }
location = /src/pages/fokus-lead.html { return 301 /produtos/fokus-lead; }
location = /src/pages/fokus-law-assinatura.html { return 301 /assinaturas/fokus-law; }
location = /src/pages/fokus-lead-assinatura.html { return 301 /assinaturas/fokus-lead; }

location = /auth/cadastro.html { return 301 /cadastro$is_args$args; }
location = /auth/verificar-email.html { return 301 /verificar-email$is_args$args; }
location = /auth/criar-senha.html { return 301 /criar-senha$is_args$args; }
location = /auth/aceitar-vinculo.html { return 301 /aceitar-vinculo$is_args$args; }
location = /auth/aceitar-transferencia.html { return 301 /aceitar-transferencia$is_args$args; }

location = /admin { return 301 /acesso; }
location = /admin/ { return 301 /acesso; }
location = /admin/painel { return 301 /portal; }
location = /admin/perfil { return 301 /portal/perfil; }
location = /admin/empresas { return 301 /portal/empresas; }
location = /admin/usuarios { return 301 /portal/usuarios; }
location = /admin/assinaturas { return 301 /portal/assinaturas; }
location = /admin/transferir-administracao { return 301 /portal/transferir-administracao; }
location = /admin/empresas.html { return 301 /portal/empresas; }
location = /admin/usuarios.html { return 301 /portal/usuarios; }
location = /admin/assinaturas.html { return 301 /portal/assinaturas; }
